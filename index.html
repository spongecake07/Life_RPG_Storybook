 pas à son épée. Quand le joueur attaque, son mouvement est presque insultant de simplicité : un pas de côté, une main autour du poignet, un transfert de poids. Le joueur trébuche avant même de comprendre que le fragment a disparu.*\n\n*Le joueur sort des bois, le fragment en main. Un frottement familier retentit devant lui.*\n\n*Scrrrrr... pas... Scrrrrr.*\n\n*Le mercenaire s'approche lentement. Son regard se fixe sur l'objet.*\n\n**MERCENAIRE :** « Où as-tu trouvé ça ? »\n*Le joueur hésite.*\n**MERCENAIRE :** « Laisse-moi voir. »\n*Le joueur serre le fragment contre lui.*\n**MERCENAIRE :** « Il me faut cet objet. »\n\n*Le joueur lève son arme.*\n\n**MERCENAIRE :** « Ne fais pas ça. »\n\n*Le joueur attaque. Le mercenaire s'écarte. Au deuxième coup, il saisit le poignet du joueur d'une seule main. Un petit mouvement suffit à le faire trébucher. Le fragment est déjà dans la main du mercenaire.*\n\n*Son immense épée n'a jamais quitté le sol.*\n\n**JOUEUR :** « Rends-le-moi. »\n**MERCENAIRE :** « Non. »\n**JOUEUR :** « Pourquoi tu ne m'as pas tué ? »\n**MERCENAIRE :** « Personne ne m'a payé pour ça. »\n**JOUEUR :** « Quelqu'un finira par te tuer. »\n**MERCENAIRE :** « Je l'espère. »\n\n*Il se détourne. Ses épaules s'affaissent.*\n\n*Scrrrrr... pas... Scrrrrr.*\n\n**NOTE D'AUTEUR :** Ce n'est volontairement pas un combat de boss. Le joueur est comme une mouche qui s'attaque à un lion. Le mercenaire emploie une force minimale et ne dégaine jamais. Le joueur a déjà vu ce qui se produit lorsqu'il combat sérieusement. Le mercenaire part avec le fragment; une éventuelle interception ou récupération reste à décider."},{"n":20,"title":"LE REPLI DES FOUILLEURS [PROPOSITION]","body":"**EXT. SITE DES FOUILLES — PLUS TARD**\n\n*Quand les chercheurs reviennent aux fouilles, un feu de cuisine a été étouffé sous la terre. Un gant abandonné repose près d'une caisse. La toile qui cachait l'entrée s'est détachée et claque contre un poteau. Les traces partent dans plusieurs directions; aucune ne promet de réponse facile.*\n\n*L'objet a disparu et le secret de l'opération est compromis. Les fouilleurs abandonnent les lieux, laissant du matériel et des provisions.*\n\n**CHOIX DU JOUEUR**\n- **Examiner ce qui a été abandonné.**\n- **Faire passer le retour de Teren en priorité.**\n- **Faire un rapport à Osric.**\n\n*Personne ne prétend que le mystère est résolu.*\n\n# ACTE V — CE QUI RESTE"},{"n":21,"title":"LE RETOUR DE TEREN [PROPOSITION]","body":"**EXT. CHAUMIÈRE DE TEREN — SOIR**\n\n*Une bougie brûle à la fenêtre de Nessa alors que le ciel n'est pas encore tout à fait sombre. Bracken entend les pas avant les autres. Ses griffes claquent sur le plancher, puis il se faufile entre les jambes de Nessa avant qu'elle puisse retenir son collier. Teren se penche maladroitement pour lui toucher la tête et manque de perdre l'équilibre.*\n\n*Pendant plusieurs secondes, Nessa ne dit rien. Elle serre le montant de la porte et regarde son visage tuméfié, sa manche déchirée. Puis elle s'écarte pour le laisser entrer.*\n\n*Nessa ouvre avant même qu'on frappe. Bracken se faufile entre ses jambes et court vers Teren.*\n\n**NESSA :** « Tu es en retard. »\n**TEREN :** « Je sais. »\n\n*Elle lui tend un repas enveloppé dans un linge, puis se rappelle depuis combien de temps il attend.*\n\n**NESSA :** « Ne mange pas ça. »\n*Un rire bref et épuisé lui échappe.*\n**TEREN :** « De l'eau d'abord. Après, je dors. »\n\n*On peut appeler Elowen pour s'occuper de lui. Osric ne consigne que les faits que les témoins peuvent confirmer.*"},{"n":22,"title":"LE VILLAGE CONTINUE [PROPOSITION]","body":"**EXT. VILLAGE — JOURS SUIVANTS**\n\n*Le village retrouve ses habitudes à sa manière. Le boulanger ouvre avant l'aube; le marteau de Garran reprend son rythme familier; un nouveau seau apparaît sous la fuite de Mara si personne ne l'a réparée. Lysa éprouve sa barrière d'une bonne poussée et semble satisfaite. Alden s'est fabriqué des rênes avec une ficelle et tente de convaincre un âne patient qu'il est un cheval de guerre.*\n\n*Certaines choses ont changé. Des conversations s'interrompent quand le joueur entre à l'auberge. La route du nord est surveillée plus attentivement. Devant la maison de Mirelle, il ne reste qu'une légère marque dans la terre à l'endroit où reposait l'épée.*\n\n*Garran attend toujours un paiement. Le toit de Mara fuit encore, sauf si le joueur l'a réparé. La barrière de Lysa tient bon. Alden rêve toujours d'avoir un cheval. Elowen retourne à son jardin.*\n\n*Devant la maison de Mirelle, l'immense épée a disparu.*\n\n**CHOIX DU JOUEUR**\n- **Rendre visite aux villageois** — Les conversations facultatives reflètent les quêtes secondaires accomplies.\n- **Rentrer à la maison** — Passer à la dernière scène."},{"n":23,"title":"LA MARQUE À LA MAISON [PROPOSITION]","body":"**INT. MAISON DU PÈRE — SOIR**\n\n*La maison sent moins le renfermé. L'air frais soulève le rideau de la cuisine et la charnière réparée ne coince plus. Le joueur trie des reçus, de la vieille ficelle, une règle en bois fendue et des papiers dont l'encre a pâli aux plis. Le dessin glisse d'un compte ordinaire de dépenses domestiques.*\n\n*Le symbole n'est pas identique à celui du fragment, mais la ressemblance est difficile à ignorer. Le joueur retourne la feuille. Rien. Dehors, un voisin appelle à l'aide pour sortir la roue d'une charrette d'une ornière. Le village a toujours besoin de bras.*\n\n*Le joueur trie de vieux papiers et des objets ordinaires. Un dessin glisse entre deux pages. Sa marque ressemble à celle du fragment brisé, près du contour incomplet de quelque chose de plus grand.*\n\n*Aucun nom, aucune date, aucune explication ne permet de savoir ce que son père connaissait.*\n\n*Dehors, un voisin appelle à l'aide pour un chariot.*\n\n*Le joueur replie le dessin et le met de côté.*\n\n**FIN DU CHAPITRE UN — VERSION SCÉNARISÉE DE TRAVAIL**"}]};
const $=id=>document.getElementById(id);
const stored=(()=>{try{return JSON.parse(localStorage.getItem("life-rpg-storybook")||"{}")}catch{return {}}})();
let lang=stored.lang==="fr"?"fr":"en",scene=Math.max(0,Math.min(22,stored.scene||0)),pageIndex=stored.page||0,parts=[];
const labels={en:{contents:"Contents",previous:"Previous",next:"Next",tip:"Swipe or use arrow keys to turn pages · Progress saved on this device",scene:"Scene",page:"Page",of:"of"},fr:{contents:"Sommaire",previous:"Précédente",next:"Suivante",tip:"Glissez ou utilisez les flèches du clavier · Progression sauvegardée sur cet appareil",scene:"Scène",page:"Page",of:"sur"}};
function escapeHTML(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function format(line){let s=escapeHTML(line);s=s.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/~~(.*?)~~/g,"<del>$1</del>").replace(/`(.*?)`/g,"<code>$1</code>");return s}
function blocks(body){let result=[];for(let line of body.split("\n")){line=line.trim();if(!line)continue;if(line.startsWith("## "))continue;if(line.startsWith("**EXT.")||line.startsWith("**INT."))result.push('<p class="eyebrow">'+format(line)+'</p>');else if(line.startsWith("**PLAYER CHOICES")||line.startsWith("**CHOIX DU JOUEUR")||line.startsWith("**OPTIONAL")||line.startsWith("**CHOIX FACULTATIF")||line.startsWith("**QUÊTE")||line.startsWith("**QUEST")||line.startsWith("**STORY")||line.startsWith("**OBJET"))result.push('<p class="heading">'+format(line)+'</p>');else if(line.startsWith("- "))result.push('<p class="choice">'+format(line.slice(2))+'</p>');else if(/^\*[^*].*\*$/.test(line))result.push('<p class="direction">'+format(line)+'</p>');else if(/^\*\*[^*]+:\*\*/.test(line))result.push('<p class="dialogue">'+format(line)+'</p>');else if(/^\*?Scrrrrr|^\*?Clang|^\*?Tap/.test(line))result.push('<p class="sound">'+format(line)+'</p>');else if(line.startsWith("> "))result.push('<p class="note">'+format(line.slice(2))+'</p>');else result.push('<p>'+format(line)+'</p>')}return result}
function paginate(){const all=blocks(stories[lang][scene].body);parts=[];let part=[],count=0;for(const b of all){let chars=b.replace(/<[^>]*>/g,"").length;let limit=window.innerWidth<650?1150:1750;if(part.length&&count+chars>limit){parts.push(part.join(""));part=[];count=0}part.push(b);count+=chars}if(part.length)parts.push(part.join(""));if(!parts.length)parts=[""];pageIndex=Math.min(pageIndex,parts.length-1)}
function save(){try{localStorage.setItem("life-rpg-storybook",JSON.stringify({lang,scene,page:pageIndex}))}catch{}}
function render(resetScroll=true){paginate();const l=labels[lang],s=stories[lang][scene];document.documentElement.lang=lang;$("language").value=lang;$("contentsLabel").textContent=l.contents;$("prevLabel").textContent=l.previous;$("nextLabel").textContent=l.next;$("tip").textContent=l.tip;$("tocTitle").textContent=l.contents;$("page").innerHTML='<div class="eyebrow">'+l.scene+' '+s.n+' · '+l.page+' '+(pageIndex+1)+' '+l.of+' '+parts.length+'</div><h1>'+escapeHTML(s.title.replace(/ \[(?:PROPOSED|PROPOSITION).*$/,""))+'</h1><div class="story">'+parts[pageIndex]+'</div>';$("counter").textContent=l.scene+' '+(scene+1)+' / '+stories[lang].length+' · '+l.page+' '+(pageIndex+1)+' / '+parts.length;$("prev").disabled=scene===0&&pageIndex===0;$("next").disabled=scene===stories[lang].length-1&&pageIndex===parts.length-1;save();if(resetScroll)window.scrollTo({top:0,behavior:"instant"})}
function move(dir){if(dir>0){if(pageIndex<parts.length-1)pageIndex++;else if(scene<stories[lang].length-1){scene++;pageIndex=0}}else{if(pageIndex>0)pageIndex--;else if(scene>0){scene--;pageIndex=999}}render()}
$("next").onclick=()=>move(1);$("prev").onclick=()=>move(-1);
$("language").onchange=e=>{lang=e.target.value;pageIndex=0;render()};
$("contents").onclick=()=>{const l=labels[lang];$("tocitems").innerHTML=stories[lang].map((s,i)=>'<button data-scene="'+i+'">'+l.scene+' '+s.n+' — '+escapeHTML(s.title)+'</button>').join("");$("toc").classList.add("open")};
$("close").onclick=()=>$("toc").classList.remove("open");
$("tocitems").onclick=e=>{const b=e.target.closest("[data-scene]");if(b){scene=+b.dataset.scene;pageIndex=0;$("toc").classList.remove("open");render()}};
$("toc").onclick=e=>{if(e.target===$("toc"))$("toc").classList.remove("open")};
document.onkeydown=e=>{if($("toc").classList.contains("open")){if(e.key==="Escape")$("toc").classList.remove("open");return}if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)};
let touchStart=null;$("book").addEventListener("touchstart",e=>{touchStart={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}},{passive:true});$("book").addEventListener("touchend",e=>{if(!touchStart)return;const dx=e.changedTouches[0].screenX-touchStart.x,dy=e.changedTouches[0].screenY-touchStart.y;touchStart=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1)},{passive:true});
let layoutWidth=window.innerWidth;window.addEventListener("resize",()=>{if(window.innerWidth===layoutWidth)return;clearTimeout(window.__resize);window.__resize=setTimeout(()=>{if(window.innerWidth===layoutWidth)return;layoutWidth=window.innerWidth;render(false)},250)});
render();
</script></body></html>
