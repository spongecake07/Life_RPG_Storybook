<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#161411"><title>Life RPG · The Road Home</title>
<style>
:root{color-scheme:dark;--bg:#151310;--ink:#3a2c1f;--paper:#e8dcc1;--muted:#7b6b55;--gold:#b9975c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#34291e,#151310 72%);font-family:Georgia,'Times New Roman',serif;min-height:100vh;color:#f1e6d0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px clamp(14px,4vw,50px);font-family:system-ui,sans-serif;border-bottom:1px solid #56453655}
.brand{letter-spacing:.22em;font-size:12px;font-weight:700;color:#d8ba81}.tools{display:flex;gap:9px;align-items:center}button,select{font:inherit;cursor:pointer}button{border:1px solid #9c825f66;background:#2d261e;color:#f0e1c8;padding:9px 13px;border-radius:8px}button:hover{background:#493828}button:focus-visible,select:focus-visible{outline:2px solid #e5c88f;outline-offset:3px}select{background:#2d261e;color:#f0e1c8;padding:9px;border:1px solid #9c825f66;border-radius:8px}
main{max-width:1120px;margin:22px auto;padding:0 16px}.book{position:relative;min-height:min(73vh,840px);border:12px solid #33271c;border-radius:10px;background:linear-gradient(90deg,#c5b595 0%,#f0e4ca 4%,#e9dcc0 50%,#dfcfae 97%,#b7a384 100%);box-shadow:0 20px 65px #000a, inset 0 0 0 1px #907553;color:var(--ink);overflow:hidden}.book:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff05 0px,#ffffff05 2px,#00000003 3px,#00000003 5px);opacity:.4}.page{position:relative;max-width:760px;margin:auto;padding:clamp(28px,6vw,65px) clamp(24px,7vw,88px);min-height:min(73vh,840px)}.eyebrow{font:600 11px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#8d704b}.page h1{font-size:clamp(28px,4vw,43px);font-weight:400;line-height:1.2;margin:14px 0 28px}.story{font-size:clamp(17px,2.1vw,20px);line-height:1.85}.story p{margin:0 0 1.05em}.story .direction{font-style:italic;color:#5a4b3a}.story .dialogue{margin:.7em 0;padding-left:14px;border-left:2px solid #ab8e60}.story .choice{font-size:.86em;padding:10px 13px;background:#d7c7a6;border-radius:5px}.story .heading{font-weight:bold;font-size:.9em;letter-spacing:.08em;margin-top:1.5em}.story .note{color:#79664d;font-size:.85em}.story .sound{text-align:center;font-style:italic;letter-spacing:.12em;color:#6c5132}.story .line{border-top:1px solid #b8a17c;margin:24px 0}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1120px;margin:17px auto;padding:0 16px;font:13px system-ui,sans-serif;color:#d4c0a1}.footer .nav{display:flex;gap:10px}.progress{font-variant-numeric:tabular-nums}#toc{position:fixed;z-index:5;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px}#toc.open{display:flex}.tocbox{width:min(600px,100%);max-height:85vh;overflow:auto;background:#211b15;border:1px solid #987951;border-radius:12px;padding:22px;box-shadow:0 15px 50px #000b}.tocbox h2{font-weight:400;margin:0 0 12px}.tocbox button{display:block;text-align:left;width:100%;margin:5px 0}.tocbar{display:flex;justify-content:space-between;align-items:center}.tip{text-align:center;font:12px system-ui,sans-serif;color:#ad9779;margin:12px 0 25px}@media(max-width:600px){header{padding:12px}.brand{letter-spacing:.08em}.tools{gap:5px}.tools button,.tools select{padding:8px}.book{border-width:7px}.page{padding:28px 25px;min-height:68vh}.story{line-height:1.75}.footer{flex-wrap:wrap}.footer .nav{margin-left:auto}}@media(prefers-reduced-motion:no-preference){.page{animation:fade .23s ease}@keyframes fade{from{opacity:.4;transform:translateX(8px)}to{opacity:1;transform:none}}}
</style></head><body>
<header><div class="brand">LIFE RPG <span style="color:#a78d68">/ STORYBOOK</span></div><div class="tools"><button id="contents" aria-label="Table of contents">☰ <span id="contentsLabel">Contents</span></button><select id="language" aria-label="Language"><option value="en">English</option><option value="fr">Français</option></select></div></header>
<main><article class="book" id="book"><div class="page" id="page" aria-live="polite"></div></article></main>
<div class="footer"><span class="progress" id="counter"></span><div class="nav"><button id="prev">← <span id="prevLabel">Previous</span></button><button id="next"><span id="nextLabel">Next</span> →</button></div></div><p class="tip" id="tip">Swipe or use arrow keys to turn pages · Progress saved on this device</p>
<div id="toc" role="dialog" aria-modal="true" aria-labelledby="tocTitle"><div class="tocbox"><div class="tocbar"><h2 id="tocTitle">Contents</h2><button id="close">✕</button></div><div id="tocitems"></div></div></div>
<script>
let stories={en:[],fr:[]}
const $=id=>document.getElementById(id);
const stored=(()=>{try{return JSON.parse(localStorage.getItem("life-rpg-storybook")||"{}")}catch{return {}}})();
let lang=stored.lang==="fr"?"fr":"en",scene=Math.max(0,Math.min(22,stored.scene||0)),pageIndex=stored.page||0,parts=[];
const labels={en:{contents:"Contents",previous:"Previous",next:"Next",tip:"Swipe or use arrow keys to turn pages · Progress saved on this device",scene:"Scene",page:"Page",of:"of"},fr:{contents:"Sommaire",previous:"Précédente",next:"Suivante",tip:"Glissez ou utilisez les flèches du clavier · Progression sauvegardée sur cet appareil",scene:"Scène",page:"Page",of:"sur"}};
function escapeHTML(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function format(line){let s=escapeHTML(line);s=s.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/~~(.*?)~~/g,"<del>$1</del>").replace(/`(.*?)`/g,"<code>$1</code>");return s}
function blocks(body){let result=[];for(let line of body.split("\n")){line=line.trim();if(!line)continue;if(line.startsWith("## "))continue;if(line.startsWith("**EXT.")||line.startsWith("**INT."))result.push('<p class="eyebrow">'+format(line)+'</p>');else if(line.startsWith("**PLAYER CHOICES")||line.startsWith("**CHOIX DU JOUEUR")||line.startsWith("**OPTIONAL")||line.startsWith("**CHOIX FACULTATIF")||line.startsWith("**QUÊTE")||line.startsWith("**QUEST")||line.startsWith("**STORY")||line.startsWith("**OBJET"))result.push('<p class="heading">'+format(line)+'</p>');else if(line.startsWith("- "))result.push('<p class="choice">'+format(line.slice(2))+'</p>');else if(/^\*[^*].*\*$/.test(line))result.push('<p class="direction">'+format(line)+'</p>');else if(/^\*\*[^*]+:\*\*/.test(line))result.push('<p class="dialogue">'+format(line)+'</p>');else if(/^\*?Scrrrrr|^\*?Clang|^\*?Tap/.test(line))result.push('<p class="sound">'+format(line)+'</p>');else if(line.startsWith("> "))result.push('<p class="note">'+format(line.slice(2))+'</p>');else result.push('<p>'+format(line)+'</p>')}return result}
function paginate(){const all=blocks(stories[lang][scene].body);parts=[];let part=[],count=0;for(const b of all){let chars=b.replace(/<[^>]*>/g,"").length;let limit=window.innerWidth<650?1150:1750;if(part.length&&count+chars>limit){parts.push(part.join(""));part=[];count=0}part.push(b);count+=chars}if(part.length)parts.push(part.join(""));if(!parts.length)parts=[""];pageIndex=Math.min(pageIndex,parts.length-1)}
function save(){try{localStorage.setItem("life-rpg-storybook",JSON.stringify({lang,scene,page:pageIndex}))}catch{}}
function render(resetScroll=true){paginate();const l=labels[lang],s=stories[lang][scene];document.documentElement.lang=lang;$("language").value=lang;$("contentsLabel").textContent=l.contents;$("prevLabel").textContent=l.previous;$("nextLabel").textContent=l.next;$("tip").textContent=l.tip;$("tocTitle").textContent=l.contents;$("page").innerHTML='<div class="eyebrow">'+l.scene+' '+s.n+' · '+l.page+' '+(pageIndex+1)+' '+l.of+' '+parts.length+'</div><h1>'+escapeHTML(s.title.replace(/ \[(?:PROPOSED|PROPOSITION).*$/,""))+'</h1><div class="story">'+parts[pageIndex]+'</div>';$("counter").textContent=l.scene+' '+(scene+1)+' / '+stories[lang].length+' · '+l.page+' '+(pageIndex+1)+' / '+parts.length;$("prev").disabled=scene===0&&pageIndex===0;$("next").disabled=scene===stories[lang].length-1&&pageIndex===parts.length-1;save();if(resetScroll)window.scrollTo({top:0,behavior:"instant"})}
function move(dir){if(dir>0){if(pageIndex<parts.length-1)pageIndex++;else if(scene<stories[lang].length-1){scene++;pageIndex=0}}else{if(pageIndex>0)pageIndex--;else if(scene>0){scene--;pageIndex=999}}render()}
$("next").onclick=()=>move(1);$("prev").onclick=()=>move(-1);
$("language").onchange=e=>{lang=e.target.value;pageIndex=0;render()};
$("contents").onclick=()=>{const l=labels[lang];$("tocitems").innerHTML=stories[lang].map((s,i)=>'<button data-scene="'+i+'">'+l.scene+' '+s.n+' — '+escapeHTML(s.title)+'</button>').join("");$("toc").classList.add("open")};
$("close").onclick=()=>$("toc").classList.remove("open");
$("tocitems").onclick=e=>{const b=e.target.closest("[data-scene]");if(b){scene=+b.dataset.scene;pageIndex=0;$("toc").classList.remove("open");render()}};
$("toc").onclick=e=>{if(e.target===$("toc"))$("toc").classList.remove("open")};
document.onkeydown=e=>{if($("toc").classList.contains("open")){if(e.key==="Escape")$("toc").classList.remove("open");return}if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)};
let touchStart=null;$("book").addEventListener("touchstart",e=>{touchStart={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}},{passive:true});$("book").addEventListener("touchend",e=>{if(!touchStart)return;const dx=e.changedTouches[0].screenX-touchStart.x,dy=e.changedTouches[0].screenY-touchStart.y;touchStart=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1)},{passive:true});
let layoutWidth=window.innerWidth;window.addEventListener("resize",()=>{if(window.innerWidth===layoutWidth)return;clearTimeout(window.__resize);window.__resize=setTimeout(()=>{if(window.innerWidth===layoutWidth)return;layoutWidth=window.innerWidth;render(false)},250)});
async function loadStorybook(){
  try{
    const responses=await Promise.all(["en","fr"].map(lang=>fetch("story-content/chapter-one-"+lang+".json",{cache:"no-cache"})));
    for(const response of responses)if(!response.ok)throw Error("Story content request failed: "+response.status);
    const [en,fr]=await Promise.all(responses.map(response=>response.json()));
    if(!Array.isArray(en)||!Array.isArray(fr)||en.length!==23||fr.length!==23)throw Error("Incomplete story content");
    for(const scenes of [en,fr])for(let i=0;i<scenes.length;i++)if(scenes[i].n!==i+1||!scenes[i].body||!scenes[i].title)throw Error("Invalid scene "+(i+1));
    stories={en,fr};
    render();
  }catch(error){
    console.error("Unable to load Storybook:",error);
    document.querySelector(".story").textContent="The story could not be loaded. Please refresh the page.";
  }
}
loadStorybook();
</script></body></html>
