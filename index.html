0 0 12px}.tocbox button{display:block;text-align:left;width:100%;margin:5px 0}.tocbar{display:flex;justify-content:space-between;align-items:center}.tip{text-align:center;font:12px system-ui,sans-serif;color:#ad9779;margin:12px 0 25px}@media(max-width:600px){header{padding:12px}.brand{letter-spacing:.08em}.tools{gap:5px}.tools button,.tools select{padding:8px}.book{border-width:7px}.page{padding:28px 25px;min-height:68vh}.story{line-height:1.75}.footer{flex-wrap:wrap}.footer .nav{margin-left:auto}}@media(prefers-reduced-motion:no-preference){.page{animation:fade .23s ease}@keyframes fade{from{opacity:.4;transform:translateX(8px)}to{opacity:1;transform:none}}}

<script>
const stories={"en":[{"n":1,"title":"THE ROAD HOME","body":"**EXT. VILLAGE ROAD — LATE AFTERNOON**\n\n*The road bends around a low stone wall before descending toward the village. Grass grows between the stones, and a few crows pick through the remains of a harvested field. The wind smells of damp earth and woodsmoke. Beyond the roofs, a thin plume rises from Garran's forge. The old bell tower stands above the square, its stone dark with rain.*\n\n*A cart approaches, wheels rattling over the uneven road. Its driver slows to let the player pass.*\n\n**CART DRIVER:** \"Afternoon. Road's muddy past the bend. Keep left if you don't fancy losing a boot.\"\n\n*The horse snorts and the cart continues uphill. In the player's coat pocket, the folded letter announcing their father's death has softened at its creases. It is short: a date, arrangements, a request to return. No last words.*\n\n**EXT. FATHER'S HOUSE — LATE AFTERNOON**\n\n*The front gate hangs crooked. Its latch catches, and the narrow path has almost disappeared beneath weeds. A clay flowerpot beside the step holds only dead stems. The key resists, then turns with a small click.*\n\n**INT. FATHER'S HOUSE — EVENING**\n\n*Cool air smells of timber, dust and old ashes. A coat hangs from a peg. Beneath it stand two worn boots, one loosely laced and the other carefully tied. A little stool has been repaired with a mismatched wooden leg. Somewhere deeper inside, a shutter taps against its frame.*\n\n*Tap. A pause. Tap... tap.*\n\n*In the kitchen, the last light enters through a narrow window. Dust floats above the table. A chipped cup sits near the cold hearth, a brown ring inside it. A spoon rests on folded cloth. The chair has been pulled back a little from the table. A poker leans against the wall rather than hanging on its hook.*\n\n**OPTIONAL INSPECTION — CUP:** *The chip lies just where a thumb would rest. An older crack has been repaired, but it is spreading again.*\n\n**OPTIONAL INSPECTION — BOOTS:** *The leather has stiffened. Dried mud clings to the soles, and twine replaces one broken lace.*\n\n**OPTIONAL INSPECTION — SHELF:** *One jar holds salt, another a few dried herbs. The label on a third has faded beyond reading.*\n\n*Beneath a small glass jar lies a folded piece of paper. The handwriting leans slightly right, with the final word of each line pressed harder into the page. The last item is crossed out with two firm strokes. Nothing is written on the reverse.*\n\n*As the player returns the note to the table, wind rattles the shutter. The kitchen door moves in its frame and gives a metallic squeal. Its bottom corner catches on the floor. A second push sends rust down onto the boards.*\n\n*From across the village comes the distant ring of a hammer.*\n\n*Clang. A pause. Clang... clang.*\n\n*Garran's forge is still open.*\n\n*The player walks the familiar road toward the village. The letter announcing their father's death is creased from being opened too many times. The houses are smaller than remembered.*\n\n**INT. FATHER'S HOUSE — EVENING**\n\n*Dust on the table. A chipped cup by the hearth. Old boots beside the door. A handwritten list rests under a jar.*\n\n**INSPECT — FATHER'S LIST**\n\n> Oil. Salt. Replace the kitchen hinge. ~~Return Garran's hammer.~~\n\n*The kitchen door catches against its frame.*\n\n**PLAYER CHOICES**\n- **Examine the house** — Inspect cup, boots, ordinary belongings and list.\n- **Try the kitchen door** — Discover the damaged hinge.\n- **Visit Garran's forge** — Advance the story.\n\n**QUEST UPDATE:** Repair the kitchen hinge. No magical interpretation of the father's belongings."},{"n":2,"title":"GARRAN'S FORGE","body":"**INT. FORGE — DAY**\n\n*The forge is warm enough to dry the rain from a coat. Orange light slides over tools arranged on the wall, some polished by years of use, others dark with neglect. A bellows sighs behind the anvil. Garran has a black smear across one cheek and a fresh burn on his apron; he notices neither.*\n\n*When the player sets the damaged hinge on the bench, Garran nudges aside a bowl of bent nails and turns the piece under the light. He tests the pin with a thumb before choosing a hammer. The conversation continues between measured strikes rather than across a silent room.*\n\n**GARRAN:** \"That door still sticks in wet weather?\"\n**PLAYER:** \"Worse than it used to.\"\n**GARRAN:** \"Your father said that every autumn. Then he'd forget about it until the next.\"\n\n*Garran works an iron bar. He finishes the stroke before looking up.*\n\n**GARRAN:** \"Well. Look who found the road back.\"\n**PLAYER:** \"The kitchen hinge is going.\"\n**GARRAN:** \"Bring it here.\"\n\n*He examines it, selects a tool, and straightens the damaged fitting.*\n\n**PLAYER:** \"What do I owe you?\"\n**GARRAN:** \"For that? Nothing.\"\n\n*He takes an old hammer from a shelf.*\n\n**GARRAN:** \"Your father left this with me. Or I left it with him. We argued about that often enough.\"\n\n**PLAYER CHOICES**\n- **Ask about your father** — Garran recalls a small ordinary habit, not a hidden revelation.\n- **Ask about the weapons on the bench** — Garran mentions an impatient customer's order for blades.\n- **Thank Garran** — Take the hammer home.\n\n**STORY ITEM:** Father's hammer — keepsake only, not a weapon or equipment.\n\n*As the player leaves, a blow at the anvil bends a piece of metal unexpectedly. Garran frowns, turns it over, and resumes work. No explanation is offered.*"},{"n":3,"title":"OSRIC AND LITTLE ALDEN","body":"**EXT. VILLAGE SQUARE — DAY**\n\n*The square is busy in the unremarkable way of a place that knows its own hours. Someone beats dust from a rug above an open window. A baker props a tray of cooling loaves on the sill, and a dog waits below with an optimism the baker does not share. At the well, a woman is telling another that her bucket rope has frayed again.*\n\n*Little Alden's stick whistles past a wooden post. He has tied a strip of red cloth around one arm, although it keeps sliding down to his elbow. Osric pauses to watch, carrying his kindling with the easy balance of someone accustomed to uneven paths.*\n\n*Little Alden duels imaginary enemies with a stick. Osric passes with a bundle of kindling.*\n\n**ALDEN:** \"Seven bandits! All at once!\"\n**OSRIC:** \"Six last week.\"\n**ALDEN:** \"One more came.\"\n**OSRIC:** \"Then one of the seven can help you carry that firewood.\"\n\n*The boy makes a face but goes to collect it.*\n\n**OSRIC:** \"You're back. How's the old place?\"\n**PLAYER:** \"Needs work.\"\n**OSRIC:** \"I've a ladder you can borrow. Bring it back before the rain.\"\n\n**PLAYER CHOICES**\n- **Ask Osric about the village** — Hear ordinary village concerns.\n- **Speak with Alden** — Hear about his ambitions; he returns to his chores.\n- **Continue through the square** — Advance.\n\n*Osric's former hunting experience is ordinary knowledge. His military past is not mentioned or hinted at through exposition.*"},{"n":4,"title":"LYSA'S FARM","body":"**EXT. FARM GATE — DAY**\n\n*A loose board bangs against the fence with each gust. The farm smells of crushed grass, damp straw and the sharp sweetness of apples rotting beneath a tree. Lysa has one boot planted in the mud, her sleeve caught on a nail, and no patience left for the goat already disappearing behind the shed.*\n\n**LYSA:** \"Don't just stand there looking at her. She knows exactly what she's doing.\"\n\n*The goat pauses to chew a leaf, as though considering the accusation. Lysa pulls her sleeve free with a tearing sound and winces at the new hole.*\n\n*A goat pushes through a loose gate. Lysa grabs one side as the latch swings free.*\n\n**LYSA:** \"If you've come to help, grab the gate!\"\n**PLAYER:** \"Does it always do this?\"\n**LYSA:** \"Only when I'm busy.\"\n\n**PLAYER CHOICES**\n- **Help Lysa** — Choose ONE activity from existing real-life goals.\n- **Ask about the goat** — Ordinary dialogue, no requirement.\n- **Return later** — Quest remains available.\n\n**REAL-LIFE QUEST — REPAIR THE GATE**\n- Fitness goal: bracing and lifting the gate in the story.\n- Running/walking goal: helping retrieve the escaped goat.\n- Reading/learning goal: understanding and repairing the latch.\n- Other existing goals: map to equivalent meaningful effort without changing the outcome.\n\n*On genuine activity completion, the gate is repaired. Award the standard +25 XP once through the existing activity ledger; no second story XP reward.*\n\n**LYSA:** \"There. Let's see the little monster try that again.\"\n\n*An out-of-season flower grows near the fence.*\n\n**PLAYER:** \"That flower shouldn't be blooming.\"\n**LYSA:** \"Tell it that. I've tried.\""},{"n":5,"title":"MARA'S INN","body":"**INT. INN — EVENING**\n\n*The inn is crowded with the small discomforts of evening: wet cloaks steaming near the hearth, bowls knocking against tabletops, and the smell of onions from a pot that has been simmering too long. A board near the entrance rocks beneath every third step. Mara has wedged folded paper under one leg of the nearest table, but the table still wobbles.*\n\n*The conversation about Teren begins in the middle of an argument about the weather. No one announces that a mystery has begun. A man breaks bread into his stew while another tries to remember which morning he last saw the hunter. When Nessa arrives, she stays near the door, the cloth parcel held close against her ribs.*\n\n*Mara shifts a bucket beneath a ceiling leak and carries stew to a table.*\n\n**MARA:** \"Anywhere but under that drip.\"\n\n**VILLAGER:** \"Teren's probably found a deer worth chasing.\"\n**MARA:** \"He's been gone since yesterday.\"\n\n*Nessa enters with a cloth-wrapped parcel.*\n\n**MARA:** \"Nessa. Any word?\"\n**NESSA:** \"Nothing.\"\n**MARA:** \"He'll turn up. You know what he's like.\"\n**NESSA:** \"He left his hunting knife.\"\n**MARA:** \"His knife?\"\n**NESSA:** \"Still hanging beside the door. He never goes anywhere without it.\"\n**VILLAGER:** \"Maybe he took another.\"\n**NESSA:** \"He doesn't have another.\"\n\n*The room falls quiet for a moment. Mara sets down the bowl in her hands.*\n\n**PLAYER CHOICES**\n- **Speak with Mara** — Ask when Teren was last seen.\n- **Ask the villagers** — Hear speculation, not confirmed facts.\n- **Follow Nessa** — Continue the missing-hunter thread.\n\n**MAIN QUEST:** Find out what happened to Teren.\n\n# ACT II — A MISSING MAN"},{"n":6,"title":"NESSA'S REQUEST","body":"**EXT. TEREN'S COTTAGE — MORNING**\n\n*Morning light catches on the waxed thread as Nessa draws it through the leather. A bowl of water stands beside her chair, with a needle balanced across its rim. Bracken's muzzle has gone gray around the whiskers. Each time footsteps pass on the road, his ears lift before he settles again.*\n\n**PLAYER:** \"Have you slept?\"\n**NESSA:** \"Enough.\"\n*She pulls the thread too hard; it snaps. For a moment she looks at the broken end, then reaches for the needle again.*\n**NESSA:** \"He said he'd be back for supper. He was very particular about that.\"\n\n*Nessa works at a leather strap. Bracken, Teren's aging hunting dog, lies by the door watching the road.*\n\n**NESSA:** \"If you're looking for Teren, you're out of luck.\"\n**PLAYER:** \"Still no word?\"\n**NESSA:** \"No. Osric said he'd ask around.\"\n\n*She pulls the thread tight.*\n\n**NESSA:** \"I made rabbit stew. He hates it when I make rabbit stew. Still hasn't come home to complain.\"\n\n*Bracken stands, looking down the road. Nessa calls him back. She unfolds a roughly drawn map.*\n\n**NESSA:** \"He was hunting beyond the old river crossing. Would you help me find him?\"\n\n**PLAYER CHOICES**\n- **I'll help.** — Accept search.\n- **I'll speak to Osric first.** — Same main quest, alternative conversation order.\n- **Where exactly was he going?** — Examine map and ask questions.\n\n**OPTIONAL PREPARATION:** An activity from an existing real-life goal may supply a modest later advantage; it is not required to talk to Nessa or accept the quest."},{"n":7,"title":"OSRIC'S DECISION","body":"**EXT. VILLAGE SQUARE — DAY**\n\n*Osric smooths the map against the wall with a broad, weathered palm. The ink has blurred where Nessa folded it while it was still damp. He weighs down one corner with a pebble and studies the river crossing without speaking. Alden calls from the other side of the square, demanding to know whether the search party needs a swordsman; Osric tells him the firewood still needs stacking.*\n\n*At the father's house, the sturdier boots are tucked beneath a bench. One is stuffed with old newspaper to hold its shape. The player shakes out a little dust, checks the stitching and finds the soles still firm.*\n\n*Osric spreads Nessa's map on a low wall.*\n\n**OSRIC:** \"I'll come. We start at the bridge and follow his usual route.\"\n\n*He looks at the player's worn footwear.*\n\n**OSRIC:** \"Find yourself a decent pair of boots. The ground's miserable up there.\"\n**PLAYER:** \"These won't do?\"\n**OSRIC:** \"Not unless you fancy walking home barefoot.\"\n\n**INT. FATHER'S HOUSE — LATER**\n\n*The player finds a sturdier pair among their father's belongings.*\n\n**STORY ACTION:** Take sturdy boots. Exact inventory, stats, equipment slots and tutorial remain deferred; do not imply implemented mechanics.\n\n**EXT. OLD BRIDGE — DAY**\n\n*Osric waits. Bracken noses along the bank.*\n\n**OSRIC:** \"Better. Come on. We're burning daylight.\""},{"n":8,"title":"ELOWEN'S GARDEN","body":"**EXT. HEALER'S GARDEN — DAY**\n\n*Elowen's garden is sheltered by a low wall. Rosemary brushes the player's sleeve at the narrow entrance; damp soil clings to the toes of Elowen's shoes. A wooden label has fallen from one bed, and she is trying to remember which seedlings she planted there. Her shears close with a small, regular click until the player speaks Teren's name.*\n\n*She sets the shears on the wall rather than dropping them. Her next questions come quickly, each about something that might actually help: the last sighting, the route, who is searching. When she returns with the cloak, she shakes out a few dried leaves caught in its folds.*\n\n*Elowen clips dead leaves from an herb bed.*\n\n**ELOWEN:** \"Mind the seedlings.\"\n**PLAYER:** \"We're looking for Teren. He hasn't come home.\"\n\n*Her shears stop.*\n\n**ELOWEN:** \"Since when?\"\n**PLAYER:** \"Yesterday. Osric's coming with me.\"\n**ELOWEN:** \"And Bracken?\"\n**PLAYER:** \"Yes.\"\n**ELOWEN:** \"Good. Don't rush past the crossing just because the path looks clear.\"\n\n*She goes indoors and returns with a cloak.*\n\n**ELOWEN:** \"The weather turns quickly beyond the river. You'll be glad of it.\"\n**PLAYER:** \"I can't take yours.\"\n**ELOWEN:** \"Then bring it back.\"\n\n**STORY ITEM:** Traveler's Cloak. No stats or equip mechanic approved.\n\n**PLAYER CHOICES**\n- **Thank her.** — Take cloak.\n- **Ask about the crossing.** — Practical advice only.\n- **Continue to the bridge.** — Begin search.\n\n# ACT III — TRACKS AND STRANGERS"},{"n":9,"title":"THE FIRST FOREST SEARCH","body":"**EXT. OLD BRIDGE / FOREST — AFTERNOON**\n\n*The river moves brown and fast beneath the old bridge, carrying twigs and the occasional yellow leaf against the stone supports. Water has eaten away the mortar on the downstream side. Bracken takes his time at the bank, nose low, then circles back when a patch of ground gives him nothing.*\n\n*In the deserted camp, rain has flattened the ashes into a dark crust. A boot print survives beneath the overhang of a root, but its edges are too broken to tell much. Flies hover over an empty food wrapper. The marked crate has been dragged across the earth, leaving a shallow furrow that ends at the wheel ruts.*\n\n**PLAYER:** \"How many people?\"\n**OSRIC:** \"More than one. Beyond that, I'd rather not guess.\"\n\n*Bracken searches along the bank and pauses beside a snapped branch. Osric spots an arrow under wet leaves.*\n\n**OSRIC:** \"Teren made this. See the binding? He always winds it twice.\"\n\n*The group follows the dog to a deserted campsite: cold ashes, flattened sleeping places, a strip of cloth and a crate stamped with a merchant's mark.*\n\n**PLAYER CHOICES**\n- **Inspect the firepit.** — Cold for some time; no certain date.\n- **Inspect the crate.** — Observe merchant mark, not its owner.\n- **Inspect the cloth.** — No identification.\n- **Ask Osric what he thinks.** — He distinguishes evidence from guesswork.\n\n*Deep wheel ruts continue beyond the clearing, even over firmer earth.*\n\n**OSRIC:** \"Those were loaded heavy. More than provisions, I'd wager.\"\n\n**OPTIONAL CHOICE**\n- **Investigate further.** — Measure distance between ruts with a marked cord; set `wagon_width_measured`.\n- **Continue the search.** — No measurement; story continues.\n\n**REQUIRED REAL-LIFE QUEST:** Complete one genuine activity selected from existing personal goals to uncover the concealed side wagon trail. Initial campsite exploration remains available while pending. Award the existing +25 XP only once, without duplicate story XP.\n\n*After the activity, the player exposes a narrow wagon trail hidden beneath brush.*\n\n**PLAYER:** \"We could follow it.\"\n**OSRIC:** \"In this light? With no idea who's ahead? No. We'll come back knowing where we're going.\"\n\n*Bracken turns at Osric's call. They head home before dark.*"},{"n":10,"title":"GARRAN AND THE COUNCIL","body":"**INT. FORGE — DUSK**\n\n*The forge door stands open to the cooling street. Sparks rise briefly each time Garran lifts a bar from the coals, then vanish against the evening sky. Bracken lies down outside without waiting for permission. Osric leaves muddy prints on the threshold and apologizes; Garran waves him farther in.*\n\n*Later, the council gathers around a table too small for all its papers. Someone has brought a lantern with a cracked glass pane. A neighbor keeps interrupting to ask whether the north road should be closed, while another worries about frightening the traders. Osric waits until both finish before setting Teren's arrow on the table.*\n\n*Garran finishes a blow at the anvil.*\n\n**GARRAN:** \"Back already? Find Teren?\"\n**OSRIC:** \"No. Found a camp, though. And wagon tracks heading north.\"\n**GARRAN:** \"Through the woods?\"\n**OSRIC:** \"Deep ruts. Heavy loads, even over hard ground.\"\n**GARRAN:** \"Most traders keep to the southern road. Haven't heard of anyone taking wagons up there.\"\n\n**IF `wagon_width_measured`:**\n*The player hands Garran the marked cord. He stretches it along his workbench.*\n\n**GARRAN:** \"That's a wide axle.\"\n**PLAYER:** \"Recognize it?\"\n**GARRAN:** \"No. I've repaired plenty around here, but none quite that wide.\"\n**OSRIC:** \"Army wagons?\"\n**GARRAN:** \"Not like the ones I've worked on. Doesn't prove much, mind.\"\n\n**IF NOT MEASURED:** Skip the entire width discussion. Garran does not infer axle width from deep ruts.\n\n**EXT. TEREN'S COTTAGE — EVENING**\n\n*Nessa hears their report.*\n\n**NESSA:** \"Did anyone see Teren?\"\n**OSRIC:** \"Not yet.\"\n**NESSA:** \"Then don't tell me he's gone for good.\"\n\n**INT. COUNCIL ROOM — EVENING**\n\n*Osric reports only the arrow, deserted camp, deep ruts and concealed trail. Garran adds his limited knowledge of local wagons.*\n\n**COUNCIL MEMBER:** \"Do we send everyone up there tonight?\"\n**OSRIC:** \"No. We'll need daylight, and people who can keep quiet.\"\n\n*The council agrees to watch the roads and organize a careful search. Bracken goes home. No one knows about an excavation or the mercenary.*"},{"n":11,"title":"THE STRANGER ARRIVES [PROPOSED SCRIPT]","body":"**EXT. VILLAGE APPROACH — EVENING**\n\n*Two guards hear an unfamiliar sound from the dark road.*\n\n*Scrrrrr ... step ... Scrrrrr.*\n\n*A hooded traveler emerges slowly. His shoulders hang low; the enormous sword's tip trails through the dirt. His uneven gait suggests exhaustion, not a true injury.*\n\n**GUARD:** \"Evening. What brings you here?\"\n**STRANGER:** \"A room. Food, if there's any.\"\n**GUARD:** \"Mara's inn, past the square.\"\n**STRANGER:** \"Thank you.\"\n\n*He continues. Villagers look up as the sound passes. No one panics or challenges him. At the forge, Garran briefly watches the figure go by.*\n\n**EXT. MARA'S INN — CONTINUOUS**\n\n*Scrrrrr ... step ... Scrrrrr.*\n\n**INT. MARA'S INN — EVENING**\n\n*Conversation pauses when the door opens. A scarred face is briefly visible beneath the hood, along with hard, watchful eyes.*\n\n**STRANGER:** \"Do you have a room?\"\n**MARA:** \"If you stop dragging that thing across my floor.\"\n*The stranger lifts the sword clear.*\n**STRANGER:** \"Sorry.\"\n**MARA:** \"Supper's still hot.\"\n**STRANGER:** \"I'll have some. Thank you.\"\n\n*He pays, sits quietly and eats. Nothing suggests the extent of his ability.*\n\n**PLAYER CHOICES**\n- **Observe the stranger.** — Notice cloak, tired posture, scarred face and enormous sword; no hidden biography.\n- **Speak with Mara.** — Ordinary inn dialogue.\n- **Return to the search.** — The hunter plot continues."},{"n":12,"title":"THE WEAPONS ORDER","body":"The forge was already hot when you arrived.\n\nEven from the street, you could hear Garran's hammer striking the anvil. The rhythm stopped as you reached the doorway, replaced by the hiss of hot metal being lowered into water.\n\nGarran examined a narrow blade beneath the light. Three others lay unfinished nearby, their handles still bare. Two men waited across from him. You recognized one: the customer who had ordered weapons days earlier. The other was narrow-faced, with a dark coat and mud drying around his boots.\n\n“I said three days,” Garran told the first man. “It's been two.”\n\n“The road isn't getting any shorter.”\n\n“Neither is the work.”\n\nThe customer gestured at the blades. “Those will do.”\n\n“They're not finished.”\n\n“They'll cut.”\n\n“So will a kitchen knife. Doesn't mean I'll sell you one without a handle.”\n\nThe second man sighed. Garran looked at him.\n\n“Something wrong?”\n\n“No.”\n\n“Good. Then stop grinding your boots into my doorstep.”\n\nThe man stepped outside. The dirt he left behind was unusually pale, almost gray, unlike the dark mud of the village streets.\n\nThe customer produced a folded paper. “We need the order delivered beyond the river crossing. There's a wagon waiting.”\n\n“Then the wagon can wait until the work's done.”\n\n“We're paying good money.”\n\n“You're paying half of good money.”\n\nCoins struck the bench. Garran counted them slowly. “Still short.”\n\nThe customer stared at him. Garran stared back. Two more coins appeared.\n\n“Now we're getting somewhere.”\n\nGarran placed the paper beneath an iron weight. A mark was printed beside the delivery instructions.\n\n**IF THE PLAYER EXAMINED THE MARKED CRATE:** You recognize the same mark stamped into the abandoned crate near Teren's hunting route.\n\n**OTHERWISE:** The mark is merely one detail on an ordinary receipt.\n\n“Do you know where they're taking those weapons?” you asked.\n\n“Across the river, apparently.”\n\n“Doesn't seem strange?”\n\n“People buy weapons. Some of them even pay for them.”\n\nGarran lifted an unfinished blade to the light.\n\n“Now, if you're here to help, there's charcoal by the wall. If you're here to ask questions, stand somewhere you're not blocking the light.”\n\nOutside, the customers were walking away. The narrow-faced man scraped his boot against a stone before following his companion around the corner. Pale grit still lay across Garran's threshold."},{"n":13,"title":"MARA'S ACCOUNT","body":"Rain had started again by the time you reached Mara's inn. Water dripped from the roof and gathered in puddles by the entrance. Inside, the air smelled of bread, damp wool, and something simmering over the hearth.\n\nMara was dragging a table away from the back wall.\n\n“Mind your feet,” she said without looking up.\n\nA drop struck the floor beside you. Another followed. A dark stain spread across the plaster above a chipped basin, already half full.\n\n“Every time it rains,” Mara muttered. “And every time someone promises they'll come look at it.”\n\nShe straightened. “Now. Did you want something?”\n\n“I wanted to ask about some travelers.”\n\n“You'll have to be more particular than that. I run an inn.”\n\n“Men who might have been traveling together. Possibly heading north.”\n\n“Had three a few nights ago. Came in separately, though not far apart.”\n\n“Did they know each other?”\n\n“Didn't say.”\n\n“They had little packets with them,” she added. “All tied up and sealed with the same dark wax. I noticed because one left a bit of it on my counter.”\n\n“Do you still have it?”\n\n“Of course not. Swept it up with the crumbs.”\n\nShe nodded toward the window facing the forest road. “One sat over there most of the evening. Kept looking outside.”\n\n“Waiting for someone?”\n\n“Maybe. Didn't ask him.”\n\n“Did they mention where they were going?”\n\n“Not to me. Look, they paid, ate, slept, and left. Apart from the mud, they didn't give me much reason to complain.”\n\nAnother drop struck the basin. Mara looked toward the ceiling.\n\n“Though if you're looking for something useful to do, you can start with that roof.”\n\n**OPTIONAL VILLAGE ERRAND:** The player may help arrange or complete the repair through an appropriate existing real-life goal. If completed, the leak stays fixed in later scenes; otherwise the basin remains.\n\nAs you turned to leave, Mara called after you.\n\n“If you're going north, mind the weather. The river rises quickly when it rains like this.”\n\nThen she returned to moving her furniture."},{"n":14,"title":"MIRELLE'S COTTAGE","body":"The rain had stopped, leaving the village streets damp beneath the afternoon light.\n\nPassing the cottages beyond the square, you noticed something leaning against a wall: an enormous sword, its tip resting in the earth beside a clay pot of herbs. You recognized it immediately. The stranger from Mara's inn.\n\nThe window above the sword stood partly open. Inside, Mirelle sat at her worktable with a battered boot across her knees. Buttons lay in a shallow dish; dark thread hung from the needle between her fingers.\n\nThe stranger sat opposite her on a low stool, one foot covered only by a worn stocking. He held a small lamp close to her work.\n\n“If you keep walking in them like this,” Mirelle said, pulling the thread tight, “I'll be sewing the road into the soles.”\n\n“Road's cheaper than leather.”\n\n“Not the way you wear it.”\n\nShe examined the stitching. “Hold that a little closer.”\n\nHe adjusted the lamp.\n\n“No, not there. You're putting your hand in the light.”\n\nHe moved it again.\n\n“There.”\n\nShe resumed sewing.\n\n**CHOICE — KEEP WALKING:** You pass the cottage without stopping. Behind you, Mirelle says something you cannot quite hear, followed by the stranger's quiet reply. The sword remains against the wall.\n\n**CHOICE — STAY AND OBSERVE:** You remain near the neighboring wall, watching through the partly open window.\n\n“This one's nearly finished,” Mirelle says. “The other will take longer.”\n\n“Take your time.”\n\n“That's easy for you to say. You're not the one sewing it.”\n\nHe holds the lamp steady. Then, without turning his head, his eyes shift toward the window. Toward you.\n\nFor a moment, your gaze meets his. There is no surprise or irritation. He simply looks at you, then returns his attention to the boot.\n\n“Is that enough light?” he asks.\n\n“For now.”\n\nYou move away. He had known you were there, but hadn't considered it worth interrupting his afternoon.\n\n**SCENE NOTE:** This is an optional observation, not a conversation. The player does not enter the cottage or interact with either character."},{"n":15,"title":"THE SECOND TRAIL","body":"The northern woods looked different without Osric beside you.\n\nDuring the first search, his familiarity with the terrain had made the narrow paths seem manageable. Bracken had known where to sniff, and Osric had known when to stop.\n\nThis time, you were alone.\n\nYou had returned to scout the area before anyone attempted another search. The wagon tracks, the merchant's mark, and the strangers' interest in the crossing suggested that something was happening beyond the river. But suggestions weren't enough to send people into danger. You needed to see what was there.\n\nThe path narrowed as you followed the swollen river upstream. Branches brushed your shoulders. At first, nothing distinguished the route from the rest of the forest.\n\nThen you noticed a broken branch. Its exposed wood was pale and fresh.\n\nFarther on, moss had been scraped from a stone. Beyond a fallen tree, two deep grooves crossed the mud.\n\nWagon tracks.\n\nSomeone had covered them with branches and leaves. You lifted one branch and saw the ruts continuing uphill behind a growth of ferns.\n\nYou followed carefully. The climb steepened. Twice, you stopped to listen.\n\nSomewhere ahead, a man shouted. Another answered. Then came the sound of wood striking wood.\n\nYou moved toward it, keeping trees between yourself and the voices.\n\nFrom a ridge you could see a clearing below. Two covered wagons stood beside an old stone opening in the hillside. One was backed close to the entrance, its wheels wedged with rocks. Men carried sacks and timber through the opening. Others stood guard.\n\nYou lowered yourself behind a fallen trunk.\n\n“How much longer are they going to keep us standing out here?” one guard asked.\n\n“Ask them.”\n\n“I did.”\n\n“And?”\n\n“They told me to get back to work.”\n\nThe other man laughed. The first did not.\n\nYou watched. One guard remained by the entrance; another walked between the wagons and the clearing's edge. A third disappeared behind the canvas covering the passage. You could not tell how many men were inside.\n\nThen came a cough from beyond the canvas. Another followed, rougher.\n\n“Quiet in there,” a man snapped.\n\nYou remained motionless. Someone was inside, someone the guards didn't want making noise. It might be Teren. But you hadn't seen him.\n\nThe guard by the wagons looked toward the ridge. You lowered your head and waited for his footsteps to move away.\n\nLooking again, you noticed a narrow depression along the hillside where rainwater had cut a channel between stones. It vanished behind bushes. You couldn't tell whether it led anywhere useful, but it was worth remembering.\n\nYou studied the clearing one last time, fixing the wagons, guards, and entrance in your mind. Then you made your way back through the trees.\n\nYou had found something important. Now you needed to tell Osric.\n\n**RECONNAISSANCE OPTIONS:** Remain hidden long enough to observe guard movements; examine the possible alternate approach; or withdraw with what you've already learned. The player does not attack or confirm Teren's identity here."},{"n":16,"title":"OSRIC'S HARD CALL [PROPOSED]","body":"**EXT. VILLAGE / FOREST EDGE — DAY**\n\n*A map has been pinned beneath a chipped mug on Osric's table. Mud dries in flakes along the player's sleeve. Outside, the square carries on: a cart needs moving, someone argues about missing chickens, a child calls for his mother. Osric lets the player finish before answering. He asks which details were seen firsthand and which were merely overheard.*\n\n**OSRIC:** \"A cough behind a curtain isn't proof it's Teren.\"\n**PLAYER:** \"I know.\"\n**OSRIC:** \"But it's enough to take seriously.\"\n\n*Osric listens to the latest confirmed observations.*\n\n**OSRIC:** \"A missing man is one danger. Twenty frightened people with knives is another.\"\n\n*He gathers a small, quiet group and sends for outside help.*\n\n**PLAYER CHOICES**\n- **Discuss a drainage approach.**\n- **Consider a distraction.**\n- **Consider negotiation.**\n\n*Exact routes, stakes and real-life activity requirements are not yet approved.*\n\n# ACT IV — THE BURIED CHAMBER"},{"n":17,"title":"THE DIG [PROPOSED]","body":"**INT. OLD STONE CHAMBER — DAY**\n\n*The chamber smells of wet stone, lamp oil and disturbed earth. Water beads along a crack in the ceiling and drops at uneven intervals into a shallow basin. Workers scrape dirt from the broken component with brushes worn nearly to the handles. A man beside the table keeps rubbing his thumb across a stained page of instructions; another complains that the lamps are burning too quickly.*\n\n*The captive sits where the lamplight barely reaches. His hair is matted, one cheek swollen, and his hands are tied in front of him with rope that has cut into the skin. When a guard passes, he lowers his head and waits for the footsteps to fade.*\n\n*Workers uncover a palm-sized broken component, cleanly worked along one edge, fractured along the other. Unfamiliar mineral-like material runs through a seam. Their commander checks practical notes.*\n\n*Nearby, a hungry, bruised captive shifts against his restraints.*\n\n**PLAYER (quietly):** \"Teren.\"\n\n**PLAYER CHOICES**\n- **Observe the workers.**\n- **Locate Teren's guards.**\n- **Prepare a rescue approach.**\n\n*The player is not told what the artifact is, who commissioned the dig, or why it matters.*"},{"n":18,"title":"TEREN'S RESCUE [PROPOSED]","body":"**INT. CHAMBER / EXIT PASSAGE — CONTINUOUS**\n\n*The escape passage is narrow enough that shoulders brush against the stone. Dust shakes from overhead when someone runs above them. Teren has to pause to catch his breath; he presses a hand to the wall and refuses the player's help until his knees nearly give way. Somewhere behind, a voice calls for a missing lantern.*\n\n**TEREN:** \"Is Bracken all right?\"\n**PLAYER:** \"He came looking for you.\"\n*Teren gives a short breath that might have been a laugh.*\n**TEREN:** \"Stubborn old fool.\"\n\n*The player and allies use their chosen approach to reach Teren.*\n\n**TEREN:** \"You shouldn't be here.\"\n**PLAYER:** \"Nessa's waiting.\"\n**TEREN:** \"Then let's not keep her waiting.\"\n\n*During the confusion, the player obtains the broken component. A maker's mark is visible near the fracture.*\n\n**PLAYER CHOICES**\n- **Help Teren toward the exit.**\n- **Look once more at the component.**\n- **Follow the agreed escape route.**\n\n*Outcomes and mechanics for rescue routes remain to be designed.*"},{"n":19,"title":"THE ARTIFACT IS TAKEN [PROPOSED; ENDGAME]","body":"**EXT. FOREST EXIT — DUSK**\n\n*The woods thin near the road. Evening light falls across the player's hands and the unfamiliar fragment, catching briefly on its broken edge. A pebble rolls down the slope ahead. Then comes the sound that has become impossible to mistake: metal rasping against stone, pausing, then rasping again. The mercenary appears between two trees, shoulders bowed beneath his travel-stained cloak.*\n\n*His gaze passes over the player's face and stops at the object. The quiet is broken by the creak of a branch high above. He does not reach for his sword. When the player attacks, the movement is so slight it is almost insulting: a sidestep, a hand around the wrist, a shift of weight. The player stumbles before understanding that the fragment is gone.*\n\n*The player emerges holding the component. The familiar scrape comes from ahead.*\n\n*Scrrrrr ... step ... Scrrrrr.*\n\n*The mercenary approaches slowly. His eyes settle on the object.*\n\n**MERCENARY:** \"Where did you find that?\"\n*The player hesitates.*\n**MERCENARY:** \"Let me see it.\"\n*The player holds it closer.*\n**MERCENARY:** \"I need that.\"\n\n*The player raises a weapon.*\n\n**MERCENARY:** \"Don't.\"\n\n*The player attacks. The mercenary steps aside. A second strike is stopped with one hand at the player's wrist. A small movement sends the player stumbling. The component is already in the mercenary's possession.*\n\n*His enormous sword has never left the ground.*\n\n**PLAYER:** \"Give it back.\"\n**MERCENARY:** \"No.\"\n**PLAYER:** \"Why didn't you kill me?\"\n**MERCENARY:** \"Nobody paid me to.\"\n**PLAYER:** \"Someone will kill you eventually.\"\n**MERCENARY:** \"I hope so.\"\n\n*He turns away. His shoulders slump.*\n\n*Scrrrrr ... step ... Scrrrrr.*\n\n**WRITER NOTE:** This is deliberately not a boss fight. The player is like a fly attacking a lion. The mercenary uses minimal force and never draws his sword. The player already witnessed what happens when he fights seriously. The mercenary leaves with the component; any subsequent interception or recovery remains undecided."},{"n":20,"title":"THE DIGGERS WITHDRAW [PROPOSED]","body":"**EXT. EXCAVATION SITE — LATER**\n\n*By the time the searchers reach the excavation again, a cookfire has been smothered with dirt. An abandoned glove lies beside a crate. The canvas that once concealed the entrance has been torn loose and flaps against a wooden pole. Tracks scatter in several directions; none promises an easy answer.*\n\n*With their object missing and their secrecy compromised, the diggers abandon the operation. Equipment and scattered supplies remain.*\n\n**PLAYER CHOICES**\n- **Inspect what was left behind.**\n- **Prioritize Teren's return.**\n- **Report to Osric.**\n\n*No one claims the larger mystery is solved.*\n\n# ACT V — WHAT REMAINS"},{"n":21,"title":"TEREN RETURNS [PROPOSED]","body":"**EXT. TEREN'S COTTAGE — EVENING**\n\n*A candle burns in Nessa's front window though the sky is not yet fully dark. Bracken is the first to hear the returning footsteps. His claws click across the boards, then he pushes past Nessa before she can catch his collar. Teren bends awkwardly to touch the dog's head and nearly loses his balance.*\n\n*For several seconds Nessa says nothing. She grips the doorframe, looking at his bruised face and torn sleeve. Then she steps aside so he can come in.*\n\n*Nessa opens the door before anyone knocks. Bracken pushes past her and runs to Teren.*\n\n**NESSA:** \"You're late.\"\n**TEREN:** \"I know.\"\n\n*She presses a wrapped meal into his hands, then remembers how long it has sat.*\n\n**NESSA:** \"Don't eat that.\"\n*She gives a brief, exhausted laugh.*\n**TEREN:** \"Water first. Then sleep.\"\n\n*Elowen can be called to attend to him. Osric records only what the witnesses can establish.*"},{"n":22,"title":"THE VILLAGE CONTINUES [PROPOSED]","body":"**EXT. VILLAGE — FOLLOWING DAYS**\n\n*The village has its own way of returning to ordinary things. The baker opens before dawn; Garran's hammer resumes its familiar rhythm; a new bucket appears beneath Mara's leak if nobody fixed it. Lysa tests her gate with one hard shove and seems satisfied. Alden has acquired a piece of string for reins and is trying to persuade a patient donkey to become a warhorse.*\n\n*There are changes too. A few people stop talking when the player enters the inn. The north road is watched more carefully. At Mirelle's cottage, the place where the greatsword rested is only a shallow mark in the soil.*\n\n*Garran still has an unpaid order. Mara's roof still leaks unless the player helped. Lysa's gate stays closed. Alden is back to dreaming about a horse. Elowen tends her garden.*\n\n*Outside Mirelle's cottage, the enormous sword is gone.*\n\n**PLAYER CHOICES**\n- **Visit villagers** — Optional follow-up conversations reflect completed side quests.\n- **Return home** — Advance to final scene."},{"n":23,"title":"THE MARK AT HOME [PROPOSED]","body":"**INT. FATHER'S HOUSE — EVENING**\n\n*The house smells less closed-in now. Fresh air moves the curtain beside the kitchen window, and the repaired hinge no longer catches when the door swings. The player sorts receipts, old twine, a cracked wooden ruler and papers whose ink has faded at the folds. The drawing slips out from beneath an ordinary account of household expenses.*\n\n*The symbol is not identical to the mark on the fragment, but the resemblance is difficult to ignore. The player turns the sheet over. Blank. Outside, a neighbor calls for someone to help lift a cart wheel from a rut. The village has not stopped needing things done.*\n\n*The player sorts ordinary papers and household odds and ends. A drawing slips from between old pages. Its mark resembles the symbol on the broken component, alongside the partial outline of something larger.*\n\n*There is no name, date or explanation establishing what their father knew.*\n\n*A neighbor calls from outside for help with a cart.*\n\n*The player folds the drawing and sets it aside.*\n\n**END OF CHAPTER ONE — SCRIPTED WORKING EDITION**"}],"fr":[{"n":1,"title":"LE CHEMIN DU RETOUR","body":"**EXT. ROUTE DU VILLAGE — FIN D'APRÈS-MIDI**\n\n*La route contourne un muret de pierre avant de descendre vers le village. L'herbe pousse entre les pierres et quelques corbeaux fouillent un champ moissonné. Le vent apporte des odeurs de terre humide et de fumée de bois. Derrière les toits, une mince colonne de fumée monte de la forge de Garran. Le vieux clocher domine la place, sa pierre assombrie par la pluie.*\n\n*Une charrette approche en cahotant. Le conducteur ralentit pour laisser passer le joueur.*\n\n**CHARRETIER :** « Bon après-midi. C'est boueux après le tournant. Reste à gauche si tu tiens à tes bottes. »\n\n*Le cheval souffle et la charrette poursuit sa montée. Dans la poche du joueur, la lettre annonçant la mort de son père s'est ramollie aux plis. Elle est courte : une date, des dispositions, une demande de revenir. Aucun dernier mot.*\n\n**EXT. MAISON DU PÈRE — FIN D'APRÈS-MIDI**\n\n*Le portail penche. Son loquet accroche et le petit chemin disparaît presque sous les mauvaises herbes. Un pot de terre près du seuil ne contient plus que des tiges mortes. La clé résiste, puis tourne avec un petit déclic.*\n\n**INT. MAISON DU PÈRE — SOIR**\n\n*L'air frais sent le vieux bois, la poussière et les cendres. Un manteau pend à une patère. Dessous, deux bottes usées : l'une avec un lacet défait, l'autre soigneusement nouée. Un petit tabouret a été réparé avec un pied de bois dépareillé. Plus loin, un volet cogne doucement contre son cadre.*\n\n*Toc. Un silence. Toc... toc.*\n\n*Dans la cuisine, les derniers rayons passent par une fenêtre étroite. La poussière flotte au-dessus de la table. Une tasse ébréchée repose près de l'âtre froid, avec un cercle brun au fond. Une cuillère est posée sur un linge plié. Une chaise est légèrement reculée. Le tisonnier est appuyé contre le mur plutôt que suspendu à son crochet.*\n\n**EXAMEN FACULTATIF — TASSE :** *L'éclat se trouve juste à l'endroit où un pouce se poserait. Une ancienne fissure a été réparée, mais recommence à s'étendre.*\n\n**EXAMEN FACULTATIF — BOTTES :** *Le cuir est raidi. De la boue séchée colle aux semelles et un bout de ficelle remplace un lacet cassé.*\n\n**EXAMEN FACULTATIF — ÉTAGÈRE :** *Un bocal contient du sel, un autre quelques herbes sèches. L'étiquette d'un troisième est devenue illisible.*\n\n*Sous un petit bocal de verre, une feuille est pliée. L'écriture penche légèrement vers la droite, et le dernier mot de chaque ligne est plus appuyé. Le dernier élément a été rayé de deux traits fermes. Le verso est vierge.*\n\n*Quand le joueur repose la note, le vent fait claquer le volet. La porte de la cuisine bouge dans son cadre et grince. Son coin inférieur frotte contre le plancher. Une deuxième poussée fait tomber de la rouille sur les lames de bois.*\n\n*Au loin, le bruit d'un marteau traverse le village.*\n\n*Clang. Une pause. Clang... clang.*\n\n*La forge de Garran est encore ouverte.*\n\n*Le joueur emprunte une route qu'il connaît depuis l'enfance. La lettre annonçant la mort de son père est froissée à force d'avoir été dépliée. Les maisons semblent plus petites que dans ses souvenirs.*\n\n**INT. MAISON DU PÈRE — SOIR**\n\n*De la poussière sur la table. Une tasse ébréchée près de l'âtre. De vieilles bottes près de la porte. Sous un pot, une liste écrite à la main.*\n\n**EXAMINER — LISTE DU PÈRE**\n\n> Huile. Sel. Réparer la charnière de la cuisine. ~~Rendre le marteau de Garran.~~\n\n*La porte de la cuisine frotte contre son cadre.*\n\n**CHOIX DU JOUEUR**\n- **Examiner la maison** — Observer la tasse, les bottes, les objets du quotidien et la liste.\n- **Essayer la porte de la cuisine** — Découvrir la charnière abîmée.\n- **Aller à la forge de Garran** — Faire progresser l'histoire.\n\n**MISE À JOUR DE QUÊTE :** Réparer la charnière. Aucun pouvoir magique n'est attribué aux objets du père."},{"n":2,"title":"LA FORGE DE GARRAN","body":"**INT. FORGE — JOUR**\n\n*La forge est assez chaude pour faire sécher un manteau trempé. La lumière orange glisse sur les outils accrochés au mur. Le soufflet pousse un long soupir derrière l'enclume. Garran a une trace noire sur la joue et une brûlure récente sur son tablier; il ne semble remarquer ni l'une ni l'autre.*\n\n*Quand le joueur dépose la charnière sur l'établi, Garran pousse de côté un bol de clous tordus. Il fait tourner la pièce sous la lumière et teste l'axe du pouce avant de choisir son marteau. La conversation avance entre les coups, sans interrompre son travail.*\n\n**GARRAN :** « Cette porte coince encore dès qu'il pleut ? »\n**JOUEUR :** « Plus qu'avant. »\n**GARRAN :** « Ton père disait ça tous les automnes. Et puis il oubliait jusqu'au suivant. »\n\n*Garran travaille une barre de fer. Il termine son coup de marteau avant de lever les yeux.*\n\n**GARRAN :** « Tiens donc. Tu as retrouvé le chemin du village. »\n**JOUEUR :** « La charnière de la cuisine est en train de lâcher. »\n**GARRAN :** « Montre-moi ça. »\n\n*Il examine la pièce, choisit un outil et redresse le métal.*\n\n**JOUEUR :** « Je te dois combien ? »\n**GARRAN :** « Pour ça ? Rien du tout. »\n\n*Il prend un vieux marteau sur une étagère.*\n\n**GARRAN :** « Ton père m'avait laissé ça. Ou c'est moi qui le lui avais laissé. On s'est assez disputés là-dessus. »\n\n**CHOIX DU JOUEUR**\n- **Parler de son père** — Garran évoque une petite habitude du quotidien, sans révélation cachée.\n- **Demander ce que sont les armes sur l'établi** — Garran mentionne une commande de lames et un client impatient.\n- **Remercier Garran** — Rapporter le marteau à la maison.\n\n**OBJET NARRATIF :** Marteau du père — souvenir uniquement, ni arme ni équipement.\n\n*Au moment où le joueur s'éloigne, un coup de marteau déforme étrangement une pièce. Garran fronce les sourcils, la retourne et reprend son travail. Aucune explication.*"},{"n":3,"title":"OSRIC ET LE PETIT ALDEN","body":"**EXT. PLACE DU VILLAGE — JOUR**\n\n*La place est animée par les petits bruits d'une journée ordinaire. Quelqu'un secoue un tapis à une fenêtre. Un boulanger pose des pains à refroidir sur le rebord, sous le regard plein d'espoir d'un chien. Près du puits, une femme se plaint que la corde de son seau s'effiloche encore.*\n\n*Le bâton du petit Alden siffle en frôlant un poteau. Il a noué un morceau de tissu rouge autour de son bras, mais le nœud glisse sans cesse vers son coude. Osric s'arrête pour regarder, sa brassée de bois parfaitement équilibrée.*\n\n*Le petit Alden combat des ennemis imaginaires avec un bâton. Osric passe avec une brassée de bois.*\n\n**ALDEN :** « Sept bandits ! Tous en même temps ! »\n**OSRIC :** « Ils étaient six la semaine dernière. »\n**ALDEN :** « Il y en a un autre qui est arrivé. »\n**OSRIC :** « Alors l'un des sept pourra t'aider à porter ce bois. »\n\n*Le garçon grimace, puis va chercher le bois.*\n\n**OSRIC :** « Te voilà de retour. Comment va la vieille maison ? »\n**JOUEUR :** « Il y a du travail. »\n**OSRIC :** « J'ai une échelle à te prêter. Ramène-la avant la pluie. »\n\n**CHOIX DU JOUEUR**\n- **Interroger Osric sur le village** — Entendre parler de préoccupations ordinaires.\n- **Parler à Alden** — Découvrir ses ambitions; il retourne ensuite à ses corvées.\n- **Traverser la place** — Continuer.\n\n*Le passé de chasseur d'Osric est connu. Son ancien service militaire n'est ni expliqué ni suggéré par la narration.*"},{"n":4,"title":"LA FERME DE LYSA","body":"**EXT. BARRIÈRE DE LA FERME — JOUR**\n\n*Une planche mal fixée claque contre la clôture à chaque rafale. La ferme sent l'herbe écrasée, la paille humide et les pommes tombées sous un arbre. Lysa a une botte enfoncée dans la boue, la manche accrochée à un clou et plus aucune patience pour la chèvre qui file derrière la remise.*\n\n**LYSA :** « Ne reste pas là à la regarder. Elle sait très bien ce qu'elle fait. »\n\n*La chèvre s'arrête pour mâcher une feuille. Lysa dégage sa manche avec un bruit de tissu déchiré et grimace en découvrant le trou.*\n\n*Une chèvre se faufile par une barrière mal fermée. Lysa retient un battant tandis que le loquet se détache.*\n\n**LYSA :** « Si tu es là pour aider, tiens cette barrière ! »\n**JOUEUR :** « Elle fait toujours ça ? »\n**LYSA :** « Seulement quand je suis occupée. »\n\n**CHOIX DU JOUEUR**\n- **Aider Lysa** — Choisir UNE activité parmi les objectifs réels existants.\n- **Poser des questions sur la chèvre** — Dialogue ordinaire, sans obligation.\n- **Revenir plus tard** — La quête reste disponible.\n\n**QUÊTE LIÉE À LA VIE RÉELLE — RÉPARER LA BARRIÈRE**\n- Objectif de conditionnement physique : maintenir et soulever la barrière dans le récit.\n- Objectif de marche ou de course : ramener la chèvre échappée.\n- Objectif de lecture ou d'apprentissage : comprendre et réparer le loquet.\n- Autres objectifs existants : proposer un effort équivalent, avec le même résultat.\n\n*Une fois l'activité réellement accomplie, la barrière est réparée. Accorder les 25 XP habituels une seule fois, par le registre d'activités existant; aucun second gain d'XP narratif.*\n\n**LYSA :** « Voilà. Qu'elle essaie donc de recommencer, la petite peste. »\n\n*Une fleur pousse près de la clôture, malgré la saison.*\n\n**JOUEUR :** « Cette fleur ne devrait pas être en train de pousser. »\n**LYSA :** « Va lui dire. Moi, j'ai essayé. »"},{"n":5,"title":"L'AUBERGE DE MARA","body":"**INT. AUBERGE — SOIR**\n\n*L'auberge rassemble tous les petits désagréments du soir : des manteaux mouillés qui fument près de l'âtre, des bols qui cognent sur les tables et l'odeur d'oignons d'une marmite laissée trop longtemps sur le feu. Une lame du plancher bouge près de l'entrée. Mara a glissé du papier sous le pied d'une table, sans parvenir à la stabiliser.*\n\n*La conversation sur Teren commence au milieu d'une dispute sur le temps. Personne n'annonce le début d'un mystère. Un homme émiette son pain dans son ragoût pendant qu'un autre cherche à se rappeler le matin où il a vu le chasseur pour la dernière fois. Quand Nessa arrive, elle reste près de la porte, son paquet serré contre elle.*\n\n*Mara déplace un seau sous une fuite au plafond et apporte du ragoût à une table.*\n\n**MARA :** « Assieds-toi où tu veux, mais pas sous cette goutte. »\n\n**VILLAGEOIS :** « Teren a sûrement trouvé un cerf qui valait le détour. »\n**MARA :** « Il n'est pas rentré depuis hier. »\n\n*Nessa entre avec un paquet enveloppé dans un linge.*\n\n**MARA :** « Nessa. Des nouvelles ? »\n**NESSA :** « Rien. »\n**MARA :** « Il va revenir. Tu le connais. »\n**NESSA :** « Il a laissé son couteau de chasse. »\n**MARA :** « Son couteau ? »\n**NESSA :** « Il est toujours accroché près de la porte. Il ne part jamais sans lui. »\n**VILLAGEOIS :** « Il en a peut-être pris un autre. »\n**NESSA :** « Il n'en a pas d'autre. »\n\n*Le silence s'installe un instant. Mara repose le bol qu'elle tenait.*\n\n**CHOIX DU JOUEUR**\n- **Parler à Mara** — Demander quand Teren a été vu pour la dernière fois.\n- **Interroger les villageois** — Entendre des suppositions, pas des faits établis.\n- **Suivre Nessa** — Poursuivre l'enquête.\n\n**QUÊTE PRINCIPALE :** Découvrir ce qui est arrivé à Teren.\n\n# ACTE II — UN HOMME DISPARU"},{"n":6,"title":"LA DEMANDE DE NESSA","body":"**EXT. CHAUMIÈRE DE TEREN — MATIN**\n\n*La lumière du matin accroche le fil ciré que Nessa tire à travers le cuir. Un bol d'eau est posé près de sa chaise, une aiguille en équilibre sur le bord. Le museau de Bracken a blanchi autour des babines. À chaque bruit de pas sur la route, ses oreilles se dressent, puis il se recouche.*\n\n**JOUEUR :** « Tu as dormi ? »\n**NESSA :** « Assez. »\n*Elle tire trop fort; le fil casse. Elle contemple un instant l'extrémité rompue, puis reprend son aiguille.*\n**NESSA :** « Il avait dit qu'il rentrerait pour souper. Il y tenait. »\n\n*Nessa répare une lanière de cuir. Bracken, le vieux chien de chasse de Teren, est couché près de la porte et surveille la route.*\n\n**NESSA :** « Si tu cherches Teren, tu perds ton temps. »\n**JOUEUR :** « Toujours aucune nouvelle ? »\n**NESSA :** « Non. Osric a dit qu'il se renseignerait. »\n\n*Elle serre le fil.*\n\n**NESSA :** « J'ai fait du ragoût de lapin. Il déteste quand j'en fais. Et il n'est toujours pas rentré pour s'en plaindre. »\n\n*Bracken se lève et regarde la route. Nessa le rappelle, puis déplie une carte grossière.*\n\n**NESSA :** « Il chassait au-delà du vieux passage de la rivière. Tu m'aiderais à le retrouver ? »\n\n**CHOIX DU JOUEUR**\n- **Je vais t'aider.** — Accepter la recherche.\n- **Je vais d'abord parler à Osric.** — Même quête principale, ordre des conversations différent.\n- **Où allait-il exactement ?** — Examiner la carte et poser des questions.\n\n**PRÉPARATION FACULTATIVE :** Une activité issue des objectifs réels existants peut donner un léger avantage plus tard; elle n'est pas nécessaire pour parler à Nessa ou accepter la quête."},{"n":7,"title":"LA DÉCISION D'OSRIC","body":"**EXT. PLACE DU VILLAGE — JOUR**\n\n*Osric aplatit la carte contre le muret de sa large main. L'encre a bavé là où Nessa l'a pliée encore humide. Il coince un coin sous un caillou et étudie le passage de la rivière en silence. De l'autre côté de la place, Alden demande si l'expédition a besoin d'un épéiste; Osric lui rappelle que le bois attend toujours d'être empilé.*\n\n*À la maison du père, les bottes solides sont rangées sous un banc. L'une contient du vieux papier journal pour garder sa forme. Le joueur secoue la poussière, vérifie les coutures et constate que les semelles tiennent encore.*\n\n*Osric étale la carte de Nessa sur un muret.*\n\n**OSRIC :** « Je viens avec toi. On part du pont et on suit son itinéraire habituel. »\n\n*Il regarde les chaussures usées du joueur.*\n\n**OSRIC :** « Trouve-toi de bonnes bottes. Le terrain est mauvais là-haut. »\n**JOUEUR :** « Celles-ci ne feront pas l'affaire ? »\n**OSRIC :** « Pas si tu tiens à rentrer avec des chaussures aux pieds. »\n\n**INT. MAISON DU PÈRE — PLUS TARD**\n\n*Le joueur trouve une paire de bottes plus solides parmi les affaires de son père.*\n\n**ACTION NARRATIVE :** Prendre les bottes solides. Le fonctionnement exact de l'inventaire, des statistiques, des emplacements d'équipement et du tutoriel reste à définir; ne pas présenter ces mécanismes comme intégrés.\n\n**EXT. VIEUX PONT — JOUR**\n\n*Osric attend. Bracken renifle la rive.*\n\n**OSRIC :** « C'est mieux. Allez, on perd la lumière du jour. »"},{"n":8,"title":"LE JARDIN D'ELOWEN","body":"**EXT. JARDIN DE LA GUÉRISSEUSE — JOUR**\n\n*Le jardin d'Elowen est protégé par un muret. Du romarin frôle la manche du joueur à l'entrée étroite; de la terre humide colle aux chaussures de la guérisseuse. Une étiquette en bois est tombée d'un carré de semis. Les cisailles se referment avec un petit clic régulier, jusqu'au moment où le joueur prononce le nom de Teren.*\n\n*Elle pose l'outil sur le mur sans le laisser tomber. Ses questions sont précises : la dernière fois qu'on l'a vu, le chemin emprunté, les personnes qui participent aux recherches. Quand elle revient avec la cape, elle secoue quelques feuilles sèches prises dans les plis.*\n\n*Elowen coupe les feuilles mortes de ses herbes.*\n\n**ELOWEN :** « Attention aux jeunes pousses. »\n**JOUEUR :** « On cherche Teren. Il n'est pas rentré. »\n\n*Ses cisailles s'immobilisent.*\n\n**ELOWEN :** « Depuis quand ? »\n**JOUEUR :** « Hier. Osric m'accompagne. »\n**ELOWEN :** « Et Bracken ? »\n**JOUEUR :** « Oui. »\n**ELOWEN :** « Bien. Ne foncez pas au-delà du passage simplement parce que le sentier semble dégagé. »\n\n*Elle rentre, puis revient avec une cape.*\n\n**ELOWEN :** « Le temps change vite de l'autre côté de la rivière. Tu seras content de l'avoir. »\n**JOUEUR :** « Je ne peux pas te prendre ça. »\n**ELOWEN :** « Alors rapporte-la-moi. »\n\n**OBJET NARRATIF :** Cape du voyageur. Aucune statistique ni mécanique d'équipement approuvée.\n\n**CHOIX DU JOUEUR**\n- **La remercier.** — Prendre la cape.\n- **Demander des précisions sur le passage.** — Conseils pratiques seulement.\n- **Rejoindre le pont.** — Commencer la recherche.\n\n# ACTE III — DES TRACES ET UN ÉTRANGER"},{"n":9,"title":"LA PREMIÈRE RECHERCHE EN FORÊT","body":"**EXT. VIEUX PONT / FORÊT — APRÈS-MIDI**\n\n*L'eau brune passe rapidement sous le vieux pont, emportant des brindilles et des feuilles jaunes contre les piliers. Le courant a rongé le mortier du côté aval. Bracken prend son temps sur la berge, le museau au ras du sol, puis revient sur ses pas quand une parcelle ne lui apprend rien.*\n\n*Dans le camp désert, la pluie a aplati les cendres en une croûte sombre. Une empreinte de botte subsiste sous une racine, mais ses contours sont trop abîmés pour être utiles. Des mouches tournent autour d'un emballage vide. La caisse marquée a été traînée sur le sol; son sillon rejoint les ornières.*\n\n**JOUEUR :** « Combien étaient-ils ? »\n**OSRIC :** « Plus d'un. Pour le reste, je préfère ne pas inventer. »\n\n*Bracken fouille la rive et s'arrête près d'une branche cassée. Osric aperçoit une flèche sous des feuilles humides.*\n\n**OSRIC :** « C'est Teren qui l'a faite. Tu vois la ligature ? Il fait toujours deux tours. »\n\n*Le chien les conduit à un camp abandonné : cendres froides, empreintes de couchages, lambeau de tissu et caisse marquée du symbole d'un marchand.*\n\n**CHOIX DU JOUEUR**\n- **Examiner le foyer.** — Éteint depuis un moment; impossible de préciser quand.\n- **Examiner la caisse.** — Observer la marque marchande sans identifier le propriétaire.\n- **Examiner le tissu.** — Aucun indice d'identité.\n- **Demander l'avis d'Osric.** — Il distingue les observations des suppositions.\n\n*De profondes ornières traversent la clairière, même là où la terre est ferme.*\n\n**OSRIC :** « Ces chariots étaient lourdement chargés. Plus que de simples provisions, à mon avis. »\n\n**CHOIX FACULTATIF**\n- **Examiner plus attentivement.** — Mesurer l'écartement des ornières avec une corde marquée; activer `wagon_width_measured`.\n- **Poursuivre la recherche.** — Ne pas prendre de mesure; l'histoire continue.\n\n**QUÊTE RÉELLE OBLIGATOIRE :** Accomplir une activité authentique parmi les objectifs personnels existants pour découvrir la piste secondaire dissimulée. L'exploration initiale du camp reste libre en attendant. Accorder les 25 XP habituels une seule fois, sans doublon.\n\n*Après l'activité, le joueur dégage une étroite piste de chariots cachée sous les broussailles.*\n\n**JOUEUR :** « On pourrait la suivre. »\n**OSRIC :** « Avec cette lumière ? Sans savoir qui se trouve devant ? Non. On reviendra quand on saura où on met les pieds. »\n\n*Bracken revient quand Osric l'appelle. Le groupe repart avant la nuit.*"},{"n":10,"title":"GARRAN ET LE CONSEIL","body":"**INT. FORGE — CRÉPUSCULE**\n\n*La porte de la forge donne sur la rue qui refroidit. Des étincelles montent un instant chaque fois que Garran retire une barre des braises, puis disparaissent dans le ciel du soir. Bracken se couche dehors sans attendre la permission. Osric laisse des traces de boue sur le seuil et s'excuse; Garran lui fait signe d'entrer.*\n\n*Plus tard, le conseil se serre autour d'une table trop petite pour tous ses papiers. Quelqu'un a apporté une lanterne dont le verre est fendu. Un voisin demande sans cesse s'il faut fermer la route du nord; un autre s'inquiète d'effrayer les marchands. Osric attend qu'ils aient terminé avant de poser la flèche de Teren sur la table.*\n\n*Garran achève un coup sur l'enclume.*\n\n**GARRAN :** « Déjà de retour ? Vous avez trouvé Teren ? »\n**OSRIC :** « Non. Mais on a trouvé un camp. Et des traces de chariots qui partent vers le nord. »\n**GARRAN :** « À travers les bois ? »\n**OSRIC :** « Des ornières profondes. Ils étaient chargés lourd, même sur la terre dure. »\n**GARRAN :** « La plupart des marchands prennent la route du sud. Je n'ai entendu parler d'aucun chariot qui passait par là. »\n\n**SI `wagon_width_measured` :**\n*Le joueur remet à Garran la corde marquée. Il l'étend sur son établi.*\n\n**GARRAN :** « C'est un essieu large. »\n**JOUEUR :** « Ça te dit quelque chose ? »\n**GARRAN :** « Non. J'en ai réparé beaucoup dans le coin, mais aucun d'aussi large. »\n**OSRIC :** « Des chariots militaires ? »\n**GARRAN :** « Pas comme ceux sur lesquels j'ai travaillé. Mais ça ne prouve pas grand-chose. »\n\n**SI LA MESURE N'A PAS ÉTÉ PRISE :** Omettre tout l'échange sur la largeur. Garran ne déduit pas l'écartement des roues à partir de la profondeur des traces.\n\n**EXT. CHAUMIÈRE DE TEREN — SOIR**\n\n*Nessa écoute leur rapport.*\n\n**NESSA :** « Quelqu'un a vu Teren ? »\n**OSRIC :** « Pas encore. »\n**NESSA :** « Alors ne me dites pas qu'il est perdu pour de bon. »\n\n**INT. SALLE DU CONSEIL — SOIR**\n\n*Osric rapporte uniquement la flèche, le camp désert, les ornières et la piste cachée. Garran ajoute ce qu'il sait réellement des chariots locaux.*\n\n**MEMBRE DU CONSEIL :** « On envoie tout le monde là-haut ce soir ? »\n**OSRIC :** « Non. Il nous faut la lumière du jour et des gens capables de rester discrets. »\n\n*Le conseil décide de surveiller les routes et de préparer une recherche prudente. Bracken rentre chez lui. Personne ne connaît encore l'existence des fouilles ni celle du mercenaire.*"},{"n":11,"title":"L'ARRIVÉE DE L'ÉTRANGER [PROPOSITION]","body":"**EXT. ENTRÉE DU VILLAGE — SOIR**\n\n*Deux gardes entendent un bruit inhabituel sur la route sombre.*\n\n*Scrrrrr... pas... Scrrrrr.*\n\n*Un voyageur encapuchonné apparaît lentement. Ses épaules sont affaissées; la pointe de son immense épée traîne dans la terre. Sa démarche irrégulière évoque l'épuisement, pas une véritable blessure.*\n\n**GARDE :** « Bonsoir. Qu'est-ce qui vous amène ? »\n**ÉTRANGER :** « Une chambre. À manger, si vous en avez. »\n**GARDE :** « L'auberge de Mara, après la place. »\n**ÉTRANGER :** « Merci. »\n\n*Il poursuit son chemin. Les villageois lèvent les yeux en entendant le frottement. Personne ne panique ni ne le provoque. Près de la forge, Garran le regarde passer un instant.*\n\n**EXT. AUBERGE DE MARA — SUITE**\n\n*Scrrrrr... pas... Scrrrrr.*\n\n**INT. AUBERGE DE MARA — SOIR**\n\n*Les conversations s'interrompent lorsque la porte s'ouvre. Sous le capuchon, la lumière laisse entrevoir un visage couvert de cicatrices et un regard dur.*\n\n**ÉTRANGER :** « Vous avez une chambre ? »\n**MARA :** « Si vous arrêtez de traîner ce machin sur mon plancher. »\n*L'étranger soulève son épée.*\n**ÉTRANGER :** « Pardon. »\n**MARA :** « Il reste du souper chaud. »\n**ÉTRANGER :** « Je vais en prendre. Merci. »\n\n*Il paie, s'assoit et mange tranquillement. Rien ne révèle l'étendue de ses capacités.*\n\n**CHOIX DU JOUEUR**\n- **Observer l'étranger.** — Remarquer la cape, la fatigue, les cicatrices et l'immense épée, sans connaître son histoire.\n- **Parler à Mara.** — Conversation ordinaire.\n- **Reprendre les recherches.** — Poursuivre l'intrigue de Teren."},{"n":12,"title":"LA COMMANDE D'ARMES [PROPOSITION]","body":"**INT. FORGE DE GARRAN — JOUR**\n\n*Le client arrive pendant que Garran trempe un outil. De la vapeur monte entre eux avec une odeur amère de métal chaud. Le deuxième homme reste près de la porte et frappe son talon contre le seuil pour en faire tomber une poussière pâle. Garran remarque les saletés, mais garde les yeux sur les pièces.*\n\n**GARRAN :** « J'ai dit trois jours. Ça n'en fait que deux. »\n**ACHETEUR :** « La route ne va pas raccourcir. »\n**GARRAN :** « Le travail non plus. »\n\n*Le client impatient revient avec un autre homme. Une poussière pâle recouvre leurs bottes.*\n\n**ACHETEUR :** « Il nous faut ces lames de l'autre côté de la rivière. »\n**GARRAN :** « Vous paierez mon travail avant que j'envoie quoi que ce soit. »\n**ACHETEUR :** « Vous serez payé. »\n**GARRAN :** « Alors on se comprend. »\n\n**CHOIX DU JOUEUR**\n- **Interroger Garran sur la commande.** — Il connaît le client, pas ses intentions.\n- **Examiner un reçu, si possible.** — Lien potentiel avec la marque de la caisse, sans preuve automatique.\n- **Partir.** — Continuer."},{"n":13,"title":"LE TÉMOIGNAGE DE MARA [PROPOSITION]","body":"**INT. AUBERGE DE MARA — JOUR**\n\n*Un filet d'eau descend le long du plâtre au-dessus du comptoir. Mara a déplacé le seau deux fois depuis le déjeuner; une auréole humide marque l'endroit où il se trouvait. Un voyageur essaie de payer avec une pièce qu'elle refuse. Elle règle cette affaire avant de répondre au joueur.*\n\n**MARA :** « Si tu veux des renseignements sur mes clients, attends que j'aie nourri ceux qui sont encore là. »\n*Elle revient avec deux bols, les pose, puis s'appuie sur le comptoir.*\n**MARA :** « Bon. Tu voulais savoir quoi ? »\n\n*Mara se débat avec un seau sous la même fuite.*\n\n**MARA :** « Ces voyageurs ? Ils ont pris des chambres séparées. Et ils ont mis de la boue partout. »\n**JOUEUR :** « Autre chose ? »\n**MARA :** « Il y en avait un qui n'arrêtait pas de regarder par la fenêtre, vers les bois. J'avais surtout peur pour mes rideaux. »\n\n**CHOIX DU JOUEUR**\n- **Poser des questions sur les voyageurs.** — Recevoir seulement des observations.\n- **Aider à réparer la fuite.** — Quête de village facultative liée à un objectif réel, avec réparation durable.\n- **Poursuivre l'enquête.**"},{"n":14,"title":"LA MAISON DE MIRELLE [PROPOSITION]","body":"**EXT. MAISON DE MIRELLE — APRÈS-MIDI**\n\n*Une rangée de chemises propres bouge doucement dans la brise près de la maison de Mirelle. L'immense épée appuyée contre le mur paraît déplacée parmi les pots de fleurs et les bobines de fil. Sa pointe s'est légèrement enfoncée dans la terre meuble. Par la fenêtre ouverte, on entend une aiguille tirer un fil à travers du cuir épais.*\n\n*À l'intérieur, l'établi de Mirelle déborde de boutons dans des soucoupes ébréchées, de ciseaux, d'une manche inachevée et d'un petit pain enveloppé. L'étranger tient la lampe exactement là où la lumière tombe sur la botte. Sa main couverte de cicatrices ne tremble pas. Mirelle retourne la chaussure, claque la langue et prend une aiguille plus grosse.*\n\n*L'immense épée repose contre le mur, à l'extérieur. À l'intérieur, Mirelle se penche sur une botte abîmée. L'étranger tient une lampe pour éclairer les coutures.*\n\n**MIRELLE :** « Si tu continues à marcher avec des bottes dans cet état, je vais finir par coudre la route dans les semelles. »\n**ÉTRANGER :** « La route coûte moins cher que le cuir. »\n**MIRELLE :** « Pas avec la façon dont tu l'uses. »\n\n*Sans qu'elle le lui demande, il rapproche la lampe.*\n\n**CHOIX DU JOUEUR**\n- **Parler à Mirelle.** — Conversation ordinaire; aucune explication sur son passé avec l'étranger.\n- **Demander des détails sur la réparation.** — Informations pratiques.\n- **Les laisser travailler.**\n\n*La narration ne définit pas leur relation. L'épée reste dehors.*"},{"n":15,"title":"LA DEUXIÈME PISTE [PROPOSITION]","body":"**EXT. BOIS DU NORD — JOUR**\n\n*Le deuxième chemin est à peine visible : des fougères écrasées, des éraflures pâles sur une branche basse et des pierres enfoncées dans la boue par une roue lourde. La forêt est plus silencieuse ici. Le joueur entend de l'eau en contrebas sans pouvoir la voir. Un garde près du passage de pierre tape des pieds pour se réchauffer, puis regarde un chariot couvert comme s'il attendait qu'on l'appelle.*\n\n*Les indices du camp et de la rivière mènent vers un passage de pierre gardé. Des chariots de ravitaillement y sont passés récemment. Derrière une toile, quelqu'un tousse.*\n\n**CHOIX DU JOUEUR**\n- **Observer depuis une cachette.** — Repérer les gardes.\n- **Se retirer et faire un rapport.** — Chercher de l'aide.\n- **Chercher une autre approche.** — Découvrir d'autres itinéraires sans imposer un combat.\n\n*Le joueur ne peut pas encore confirmer l'identité du prisonnier.*\n\n## AJOUT — LE PREMIER VÉRITABLE COMBAT DU MERCENAIRE [PROPOSITION; EMPLACEMENT À DÉFINIR]\n**EXT. CLAIRIÈRE — PENDANT LES RECHERCHES DU CONSEIL**\n\n*Séparé d'Osric et du groupe, le joueur entend le frottement familier et se cache derrière un tronc tombé.*\n\n*Scrrrrr... pas... Scrrrrr.*\n\n*L'étranger encapuchonné entre dans une clairière où plusieurs hommes armés lui barrent le passage.*\n\n**HOMME ARMÉ :** « Pas un pas de plus. »\n**ÉTRANGER :** « Écartez-vous. »\n**HOMME ARMÉ :** « Fais demi-tour. »\n*L'un d'eux dégaine.*\n**ÉTRANGER :** « Dernière chance. »\n\n*Le premier assaillant se jette sur lui. La posture épuisée de l'étranger disparaît. Son épée gigantesque se soulève d'un seul mouvement rapide.*\n\n*L'assaillant tombe. Deux autres se précipitent; l'étranger traverse leur garde et les abat avant qu'ils puissent se reprendre. Du sang éclabousse sa cape. Il ne bronche pas. Un troisième tente de frapper dans son dos; l'étranger pivote et le tue d'un geste précis.*\n\n*Des cris. Le choc de l'acier lourd. Puis le silence.*\n\n*Un blessé rampe vers les arbres. L'étranger le rejoint et l'achève. Il essuie sa lame sur la cape d'un homme tombé.*\n\n*Ses épaules retombent. Sa démarche lente et lasse revient.*\n\n*Scrrrrr... pas... Scrrrrr.*\n\n**ACTION DU JOUEUR :** Rester caché et survivre comme témoin. Le joueur est le seul à voir l'ensemble du combat; ni Osric ni le conseil n'y assistent. Ne pas déclencher de confrontation ici.\n\n**NOTE D'AUTEUR :** Le mercenaire aime combattre et semble prendre vie dans la violence, mais ne hurle pas et ne devient pas un berserker caricatural. La raison pour laquelle il tue précisément ces hommes reste **à déterminer**; ne pas établir qu'il tue sans contrat rémunéré avant de résoudre la règle existante selon laquelle il ne tue que lorsqu'il est payé pour le faire. Scène à examiner."},{"n":16,"title":"LA DÉCISION DIFFICILE D'OSRIC [PROPOSITION]","body":"**EXT. VILLAGE / LISIÈRE — JOUR**\n\n*Une carte est retenue sous une tasse ébréchée sur la table d'Osric. De la boue sèche s'effrite sur la manche du joueur. Dehors, la place continue de vivre : il faut déplacer une charrette, quelqu'un se plaint de poules disparues, un enfant appelle sa mère. Osric laisse le joueur finir, puis demande quels détails ont été vus de ses propres yeux et lesquels ont seulement été rapportés.*\n\n**OSRIC :** « Une toux derrière une toile, ça ne prouve pas que c'est Teren. »\n**JOUEUR :** « Je sais. »\n**OSRIC :** « Mais ça suffit pour prendre la chose au sérieux. »\n\n*Osric écoute les dernières observations vérifiées.*\n\n**OSRIC :** « Un homme disparu, c'est déjà un danger. Vingt personnes effrayées avec des couteaux, c'en est un autre. »\n\n*Il rassemble un petit groupe discret et envoie chercher de l'aide à l'extérieur.*\n\n**CHOIX DU JOUEUR**\n- **Discuter d'un passage par les canalisations.**\n- **Envisager une diversion.**\n- **Envisager une négociation.**\n\n*Les itinéraires exacts, les enjeux et les activités réelles nécessaires restent à définir.*\n\n# ACTE IV — LA CHAMBRE ENFOUIE"},{"n":17,"title":"LES FOUILLES [PROPOSITION]","body":"**INT. ANCIENNE CHAMBRE DE PIERRE — JOUR**\n\n*La chambre sent la pierre mouillée, l'huile de lampe et la terre fraîchement remuée. L'eau perle dans une fissure du plafond et tombe à intervalles irréguliers dans une cuvette. Des ouvriers dégagent la terre du fragment avec des pinceaux usés jusqu'au manche. Un homme frotte sans cesse son pouce sur une page tachée d'instructions; un autre se plaint que les lampes brûlent trop vite.*\n\n*Le prisonnier est assis là où la lumière arrive à peine. Ses cheveux sont emmêlés, une joue enflée et les mains attachées devant lui par une corde qui a entamé la peau. Quand un garde passe, il baisse la tête et attend que les pas s'éloignent.*\n\n*Des ouvriers dégagent un fragment de la taille d'une paume, soigneusement travaillé sur un bord et brisé sur l'autre. Une matière minérale inconnue traverse une jointure. Leur chef consulte des notes pratiques.*\n\n*Non loin, un prisonnier affamé et couvert de bleus remue dans ses liens.*\n\n**JOUEUR (à voix basse) :** « Teren. »\n\n**CHOIX DU JOUEUR**\n- **Observer les ouvriers.**\n- **Repérer les gardes de Teren.**\n- **Préparer un sauvetage.**\n\n*Le joueur n'apprend ni ce qu'est l'artefact, ni qui a commandité les fouilles, ni pourquoi il est recherché.*"},{"n":18,"title":"LE SAUVETAGE DE TEREN [PROPOSITION]","body":"**INT. CHAMBRE / PASSAGE DE SORTIE — SUITE**\n\n*Le passage de fuite est si étroit que les épaules frottent contre la pierre. De la poussière tombe du plafond quand quelqu'un court au-dessus. Teren doit s'arrêter pour reprendre son souffle; il pose une main contre le mur et refuse l'aide du joueur jusqu'à ce que ses genoux fléchissent presque. Derrière eux, une voix réclame une lanterne disparue.*\n\n**TEREN :** « Bracken va bien ? »\n**JOUEUR :** « Il est venu te chercher. »\n*Teren laisse échapper un souffle qui ressemble presque à un rire.*\n**TEREN :** « Vieux têtu. »\n\n*Le joueur et ses alliés utilisent l'approche choisie pour atteindre Teren.*\n\n**TEREN :** « Tu ne devrais pas être ici. »\n**JOUEUR :** « Nessa t'attend. »\n**TEREN :** « Alors ne la faisons pas attendre. »\n\n*Dans la confusion, le joueur récupère le fragment. Une marque de fabrication apparaît près de la cassure.*\n\n**CHOIX DU JOUEUR**\n- **Aider Teren à rejoindre la sortie.**\n- **Examiner encore le fragment.**\n- **Suivre l'itinéraire de fuite convenu.**\n\n*Les conséquences et les mécaniques des différentes méthodes de sauvetage restent à concevoir.*"},{"n":19,"title":"L'ARTEFACT EST VOLÉ [PROPOSITION; FIN DE CHAPITRE]","body":"**EXT. SORTIE DE LA FORÊT — CRÉPUSCULE**\n\n*Les arbres s'espacent près de la route. La lumière du soir glisse sur les mains du joueur et le fragment inconnu, accrochant brièvement son bord cassé. Un caillou roule sur la pente devant lui. Puis vient ce bruit désormais impossible à confondre : le métal qui râpe la pierre, s'interrompt, puis recommence. Le mercenaire apparaît entre deux arbres, les épaules courbées sous sa cape salie par le voyage.*\n\n*Son regard passe sur le visage du joueur et s'arrête sur l'objet. Une branche craque quelque part au-dessus. Il ne touche pas à son épée. Quand le joueur attaque, son mouvement est presque insultant de simplicité : un pas de côté, une main autour du poignet, un transfert de poids. Le joueur trébuche avant même de comprendre que le fragment a disparu.*\n\n*Le joueur sort des bois, le fragment en main. Un frottement familier retentit devant lui.*\n\n*Scrrrrr... pas... Scrrrrr.*\n\n*Le mercenaire s'approche lentement. Son regard se fixe sur l'objet.*\n\n**MERCENAIRE :** « Où as-tu trouvé ça ? »\n*Le joueur hésite.*\n**MERCENAIRE :** « Laisse-moi voir. »\n*Le joueur serre le fragment contre lui.*\n**MERCENAIRE :** « Il me faut cet objet. »\n\n*Le joueur lève son arme.*\n\n**MERCENAIRE :** « Ne fais pas ça. »\n\n*Le joueur attaque. Le mercenaire s'écarte. Au deuxième coup, il saisit le poignet du joueur d'une seule main. Un petit mouvement suffit à le faire trébucher. Le fragment est déjà dans la main du mercenaire.*\n\n*Son immense épée n'a jamais quitté le sol.*\n\n**JOUEUR :** « Rends-le-moi. »\n**MERCENAIRE :** « Non. »\n**JOUEUR :** « Pourquoi tu ne m'as pas tué ? »\n**MERCENAIRE :** « Personne ne m'a payé pour ça. »\n**JOUEUR :** « Quelqu'un finira par te tuer. »\n**MERCENAIRE :** « Je l'espère. »\n\n*Il se détourne. Ses épaules s'affaissent.*\n\n*Scrrrrr... pas... Scrrrrr.*\n\n**NOTE D'AUTEUR :** Ce n'est volontairement pas un combat de boss. Le joueur est comme une mouche qui s'attaque à un lion. Le mercenaire emploie une force minimale et ne dégaine jamais. Le joueur a déjà vu ce qui se produit lorsqu'il combat sérieusement. Le mercenaire part avec le fragment; une éventuelle interception ou récupération reste à décider."},{"n":20,"title":"LE REPLI DES FOUILLEURS [PROPOSITION]","body":"**EXT. SITE DES FOUILLES — PLUS TARD**\n\n*Quand les chercheurs reviennent aux fouilles, un feu de cuisine a été étouffé sous la terre. Un gant abandonné repose près d'une caisse. La toile qui cachait l'entrée s'est détachée et claque contre un poteau. Les traces partent dans plusieurs directions; aucune ne promet de réponse facile.*\n\n*L'objet a disparu et le secret de l'opération est compromis. Les fouilleurs abandonnent les lieux, laissant du matériel et des provisions.*\n\n**CHOIX DU JOUEUR**\n- **Examiner ce qui a été abandonné.**\n- **Faire passer le retour de Teren en priorité.**\n- **Faire un rapport à Osric.**\n\n*Personne ne prétend que le mystère est résolu.*\n\n# ACTE V — CE QUI RESTE"},{"n":21,"title":"LE RETOUR DE TEREN [PROPOSITION]","body":"**EXT. CHAUMIÈRE DE TEREN — SOIR**\n\n*Une bougie brûle à la fenêtre de Nessa alors que le ciel n'est pas encore tout à fait sombre. Bracken entend les pas avant les autres. Ses griffes claquent sur le plancher, puis il se faufile entre les jambes de Nessa avant qu'elle puisse retenir son collier. Teren se penche maladroitement pour lui toucher la tête et manque de perdre l'équilibre.*\n\n*Pendant plusieurs secondes, Nessa ne dit rien. Elle serre le montant de la porte et regarde son visage tuméfié, sa manche déchirée. Puis elle s'écarte pour le laisser entrer.*\n\n*Nessa ouvre avant même qu'on frappe. Bracken se faufile entre ses jambes et court vers Teren.*\n\n**NESSA :** « Tu es en retard. »\n**TEREN :** « Je sais. »\n\n*Elle lui tend un repas enveloppé dans un linge, puis se rappelle depuis combien de temps il attend.*\n\n**NESSA :** « Ne mange pas ça. »\n*Un rire bref et épuisé lui échappe.*\n**TEREN :** « De l'eau d'abord. Après, je dors. »\n\n*On peut appeler Elowen pour s'occuper de lui. Osric ne consigne que les faits que les témoins peuvent confirmer.*"},{"n":22,"title":"LE VILLAGE CONTINUE [PROPOSITION]","body":"**EXT. VILLAGE — JOURS SUIVANTS**\n\n*Le village retrouve ses habi
